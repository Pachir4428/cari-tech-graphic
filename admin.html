<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Cari Tech Graphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/styles-sections.css" />
  <link rel="stylesheet" href="assets/css/styles-modals.css" />
  <style>
    body { background: var(--bg-soft); }
    .admin-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }
    .admin-side {
      background: var(--brand-deep);
      color: #fff;
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .admin-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }
    .admin-logo-mark {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff;
    }
    .admin-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px; font-weight: 500;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      border: none;
      background: transparent;
      text-align: left;
    }
    .admin-nav-item:hover {
      color: #fff; background: rgba(255,255,255,0.05);
    }
    .admin-nav-item.active {
      background: var(--accent);
      color: #fff;
    }
    .admin-nav-item.active:hover { background: var(--accent); }
    .admin-foot {
      margin-top: auto;
      padding: 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
    .admin-foot a { color: var(--accent); }

    .admin-main {
      padding: 24px 32px 80px;
      overflow: auto;
    }
    .admin-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .admin-topbar h1 {
      font-size: 28px; letter-spacing: -0.02em;
    }
    .admin-topbar p { font-size: 13px; color: var(--ink-muted); margin: 4px 0 0; }

    .kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    .kpi {
      background: var(--bg-elev);
      border-radius: 16px; padding: 20px;
      border: 1px solid var(--line);
    }
    .kpi-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-muted);
    }
    .kpi-num {
      font-size: 32px; font-weight: 800;
      letter-spacing: -0.03em; margin-top: 8px;
    }
    .kpi-trend {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600;
      color: var(--success); margin-top: 6px;
    }

    .admin-panel {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
    }
    .admin-panel-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .admin-panel-head h2 { font-size: 20px; letter-spacing: -0.01em; }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table th, .admin-table td {
      padding: 14px 12px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }
    .admin-table th {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: var(--bg-soft);
    }
    .admin-table tbody tr:hover { background: var(--bg-soft); }
    .table-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }
    .tag-web { background: #3B82F6; }
    .tag-design { background: #A78BFA; }
    .tag-marketing { background: var(--accent); }
    .tag-active { background: var(--success); }
    .tag-draft { background: var(--ink-muted); }

    .row-actions {
      display: flex; gap: 6px;
    }
    .ra-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--ink-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
      border: none;
    }
    .ra-btn:hover { background: var(--accent); color: #fff; }
    .ra-btn.danger:hover { background: var(--danger); }

    .admin-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-soft);
      padding: 4px;
      border-radius: 999px;
      margin-bottom: 24px;
      width: fit-content;
    }
    .admin-tab {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
    }
    .admin-tab.active {
      background: var(--bg-elev);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-add:hover { transform: translateY(-1px); }

    .form-modal {
      position: fixed; inset: 0;
      background: rgba(2, 31, 33, 0.55);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
      z-index: 200;
    }
    .form-modal.show { display: flex; }
    .form-shell {
      background: var(--bg-elev);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      position: relative;
    }
    .form-shell h3 { font-size: 22px; margin-bottom: 20px; }
    .form-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }

    @media (max-width: 1024px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-side { flex-direction: row; padding: 12px; gap: 4px; overflow-x: auto; }
      .admin-logo { display: none; }
      .admin-foot { display: none; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .admin-main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ---- API do painel (admin-api.php) ----
    const api = async (action, method = 'GET', body = null) => {
      const opts = { method, headers: { 'Accept': 'application/json' }, credentials: 'same-origin' };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch(`admin-api.php?action=${action}`, opts);
      let data = {};
      try { data = await res.json(); } catch (e) {}
      return { status: res.status, ...data };
    };

    const LEAD_STATUS = {
      new:       { label: 'Novo',       cls: 'tag-marketing' },
      contacted: { label: 'Contactado', cls: 'tag-design' },
      won:       { label: 'Ganho',      cls: 'tag-active' },
      lost:      { label: 'Perdido',    cls: 'tag-draft' },
    };

    const fmtData = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const p = (n) => String(n).padStart(2, '0');
      return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };

    function FA({ name, s = 14, style = {} }) { return <i className={`fa-solid fa-${name}`} style={{fontSize:s,lineHeight:1,...style}} aria-hidden="true" />; }

    // ---- Ecrã de login ----
    function Login({ onOk }) {
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      const submit = async (e) => {
        e.preventDefault();
        setBusy(true); setErr('');
        const r = await api('login', 'POST', { password: pass });
        setBusy(false);
        if (r.ok) onOk();
        else setErr(r.message || 'Falha na autenticação.');
      };
      return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,background:'var(--brand-deep)'}}>
          <form onSubmit={submit} style={{background:'var(--bg-elev)',borderRadius:20,padding:'40px 36px',width:'100%',maxWidth:380,boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:24}}>
              <div style={{width:40,height:40,background:'var(--accent)',borderRadius:12,display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:800,color:'#fff',fontSize:18}}>C</div>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>Cari Tech</div>
                <div style={{fontSize:11,color:'var(--ink-muted)'}}>Painel de administração</div>
              </div>
            </div>
            <div className="field">
              <label>Palavra-passe</label>
              <input type="password" value={pass} autoFocus onChange={(e) => setPass(e.target.value)} placeholder="••••••••" />
              <div className="field-error">{err}</div>
            </div>
            <button type="submit" className="btn btn-accent" disabled={busy || !pass} style={{width:'100%',justifyContent:'center',marginTop:8}}>
              {busy ? 'A entrar…' : 'Entrar'} <FA name="arrow-right-to-bracket" s={14} />
            </button>
          </form>
        </div>
      );
    }

    const SEED_SERVICES = [
      { id: 1, name: 'Design Gráfico', category: 'design', price: '15.000 MZN', status: 'active', orders: 42 },
      { id: 2, name: 'Desenvolvimento Web', category: 'web', price: '80.000 MZN', status: 'active', orders: 28 },
      { id: 3, name: 'Marketing Digital', category: 'marketing', price: '25.000 MZN/mês', status: 'active', orders: 35 },
      { id: 4, name: 'Branding completo', category: 'design', price: '120.000 MZN', status: 'active', orders: 12 },
      { id: 5, name: 'Gestão Redes Sociais', category: 'marketing', price: '20.000 MZN/mês', status: 'draft', orders: 0 },
      { id: 6, name: 'Soluções IA', category: 'web', price: 'Sob consulta', status: 'active', orders: 7 },
    ];

    const SEED_PORTFOLIO = [
      { id: 1, title: 'Banco Horizonte', client: 'Horizonte Lda.', tag: 'web', status: 'active', year: 2024 },
      { id: 2, title: 'Studio Mutuanha', client: 'Mutuanha SA', tag: 'design', status: 'active', year: 2024 },
      { id: 3, title: 'Café Naparama', client: 'Naparama', tag: 'marketing', status: 'active', year: 2025 },
      { id: 4, title: 'Loja Quelimane+', client: 'Quelimane+', tag: 'web', status: 'active', year: 2025 },
      { id: 5, title: 'Festival Macuti', client: 'Macuti Org', tag: 'design', status: 'draft', year: 2025 },
      { id: 6, title: 'TechMoz Insights', client: 'TechMoz', tag: 'marketing', status: 'active', year: 2025 },
    ];

    function Pencil({ s = 14 }) { return <i className="fa-solid fa-pen" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }
    function Trash({ s = 14 }) { return <i className="fa-solid fa-trash-can" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }
    function Eye({ s = 14 }) { return <i className="fa-solid fa-eye" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }
    function Plus({ s = 14 }) { return <i className="fa-solid fa-plus" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }

    function App() {
      const [authed, setAuthed] = useState(null); // null = a verificar
      const [tab, setTab] = useState('leads');
      const [services, setServices] = useState(SEED_SERVICES);
      const [portfolio, setPortfolio] = useState(SEED_PORTFOLIO);
      const [leads, setLeads] = useState([]);
      const [leadsLoading, setLeadsLoading] = useState(false);
      const [editing, setEditing] = useState(null);
      const [editType, setEditType] = useState('');

      const loadLeads = async () => {
        setLeadsLoading(true);
        const r = await api('leads');
        setLeadsLoading(false);
        if (r.ok) setLeads(r.leads || []);
        else if (r.status === 401) setAuthed(false);
      };

      // Ao arrancar, verifica a sessão
      useEffect(() => {
        api('session').then((r) => {
          const ok = !!r.authenticated;
          setAuthed(ok);
          if (ok) loadLeads();
        });
      }, []);

      const logout = async () => { await api('logout', 'POST'); setAuthed(false); setLeads([]); };

      const setLeadStatus = async (id, status) => {
        setLeads((ls) => ls.map((l) => l.id === id ? { ...l, status } : l)); // optimista
        const r = await api('lead-status', 'POST', { id, status });
        if (!r.ok) loadLeads();
      };
      const deleteLead = async (id) => {
        if (!window.confirm('Remover este lead? Esta acção não pode ser desfeita.')) return;
        setLeads((ls) => ls.filter((l) => l.id !== id));
        const r = await api('lead-delete', 'POST', { id });
        if (!r.ok) loadLeads();
      };

      if (authed === null) {
        return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-muted)'}}>A carregar…</div>;
      }
      if (!authed) {
        return <Login onOk={() => { setAuthed(true); loadLeads(); }} />;
      }

      const openNew = (type) => {
        setEditType(type);
        setEditing(type === 'service'
          ? { id: Date.now(), name: '', category: 'design', price: '', status: 'draft', orders: 0 }
          : { id: Date.now(), title: '', client: '', tag: 'web', status: 'draft', year: 2026 });
      };
      const openEdit = (type, item) => { setEditType(type); setEditing({ ...item }); };
      const save = () => {
        if (editType === 'service') {
          setServices((s) => s.find((x) => x.id === editing.id)
            ? s.map((x) => x.id === editing.id ? editing : x)
            : [...s, editing]);
        } else {
          setPortfolio((s) => s.find((x) => x.id === editing.id)
            ? s.map((x) => x.id === editing.id ? editing : x)
            : [...s, editing]);
        }
        setEditing(null);
      };
      const remove = (type, id) => {
        if (type === 'service') setServices((s) => s.filter((x) => x.id !== id));
        else setPortfolio((s) => s.filter((x) => x.id !== id));
      };

      const kpis = [
        { l: 'Total de leads', v: leads.length },
        { l: 'Leads novos', v: leads.filter((l) => l.status === 'new').length },
        { l: 'Ganhos', v: leads.filter((l) => l.status === 'won').length },
        { l: 'Projectos', v: portfolio.length },
      ];

      return (
        <div className="admin-shell">
          <aside className="admin-side">
            <div className="admin-logo">
              <div className="admin-logo-mark">C</div>
              <div>
                <div style={{fontWeight:800,fontSize:14}}>Cari Tech</div>
                <div style={{fontSize:10,opacity:0.6}}>Admin Panel</div>
              </div>
            </div>
            <button className={`admin-nav-item ${tab === 'overview' ? 'active' : ''}`} onClick={() => setTab('overview')}><FA name="gauge-high" s={15} />Visão geral</button>
            <button className={`admin-nav-item ${tab === 'services' ? 'active' : ''}`} onClick={() => setTab('services')}><FA name="layer-group" s={15} />Serviços</button>
            <button className={`admin-nav-item ${tab === 'portfolio' ? 'active' : ''}`} onClick={() => setTab('portfolio')}><FA name="folder-open" s={15} />Portfólio</button>
            <button className={`admin-nav-item ${tab === 'leads' ? 'active' : ''}`} onClick={() => setTab('leads')}><FA name="inbox" s={15} />Leads</button>
            <button className={`admin-nav-item ${tab === 'settings' ? 'active' : ''}`} onClick={() => setTab('settings')}><FA name="gear" s={15} />Definições</button>
            <button className="admin-nav-item" onClick={logout} style={{marginTop:8}}><FA name="arrow-right-from-bracket" s={15} />Terminar sessão</button>
            <div className="admin-foot">
              Sessão activa<br/>
              <a href="index.html"><FA name="arrow-left" s={11} /> Ver site público</a>
            </div>
          </aside>

          <main className="admin-main">
            <div className="admin-topbar">
              <div>
                <h1>{tab === 'overview' ? 'Visão geral' : tab === 'services' ? 'Gestão de Serviços' : tab === 'portfolio' ? 'Gestão de Portfólio' : tab === 'leads' ? 'Pedidos & Leads' : 'Definições'}</h1>
                <p>Bem-vindo de volta. Aqui está o estado actual da Cari Tech.</p>
              </div>
            </div>

            <div className="kpi-row">
              {kpis.map((k, i) => (
                <div className="kpi" key={i}>
                  <div className="kpi-label">{k.l}</div>
                  <div className="kpi-num">{k.v}</div>
                </div>
              ))}
            </div>

            {tab === 'services' && (
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>Serviços oferecidos</h2>
                  <button className="btn-add" onClick={() => openNew('service')}><Plus />Novo serviço</button>
                </div>
                <table className="admin-table">
                  <thead><tr><th>Serviço</th><th>Categoria</th><th>Preço</th><th>Pedidos</th><th>Estado</th><th></th></tr></thead>
                  <tbody>
                    {services.map((s) => (
                      <tr key={s.id}>
                        <td style={{fontWeight:600}}>{s.name}</td>
                        <td><span className={`table-tag tag-${s.category}`}>{s.category}</span></td>
                        <td>{s.price}</td>
                        <td>{s.orders}</td>
                        <td><span className={`table-tag tag-${s.status}`}>{s.status === 'active' ? 'Activo' : 'Rascunho'}</span></td>
                        <td><div className="row-actions">
                          <button className="ra-btn" onClick={() => openEdit('service', s)}><Pencil /></button>
                          <button className="ra-btn danger" onClick={() => remove('service', s.id)}><Trash /></button>
                        </div></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'portfolio' && (
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>Projectos do portfólio</h2>
                  <button className="btn-add" onClick={() => openNew('portfolio')}><Plus />Novo projecto</button>
                </div>
                <table className="admin-table">
                  <thead><tr><th>Projecto</th><th>Cliente</th><th>Categoria</th><th>Ano</th><th>Estado</th><th></th></tr></thead>
                  <tbody>
                    {portfolio.map((p) => (
                      <tr key={p.id}>
                        <td style={{fontWeight:600}}>{p.title}</td>
                        <td>{p.client}</td>
                        <td><span className={`table-tag tag-${p.tag}`}>{p.tag}</span></td>
                        <td>{p.year}</td>
                        <td><span className={`table-tag tag-${p.status}`}>{p.status === 'active' ? 'Publicado' : 'Rascunho'}</span></td>
                        <td><div className="row-actions">
                          <button className="ra-btn"><Eye /></button>
                          <button className="ra-btn" onClick={() => openEdit('portfolio', p)}><Pencil /></button>
                          <button className="ra-btn danger" onClick={() => remove('portfolio', p.id)}><Trash /></button>
                        </div></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'leads' && (
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>Pedidos dos clientes</h2>
                  <button className="btn-add" onClick={loadLeads} style={{background:'var(--bg-soft)',color:'var(--ink)'}}>
                    <FA name="rotate" s={13} />Actualizar
                  </button>
                </div>
                {leadsLoading ? (
                  <p style={{color:'var(--ink-muted)',fontSize:14,padding:'20px 0'}}>A carregar pedidos…</p>
                ) : leads.length === 0 ? (
                  <div style={{textAlign:'center',padding:'48px 20px',color:'var(--ink-muted)'}}>
                    <FA name="inbox" s={40} style={{opacity:0.3}} />
                    <p style={{marginTop:14,fontSize:15,fontWeight:600}}>Ainda não há pedidos.</p>
                    <p style={{fontSize:13}}>Os contactos enviados pelo formulário do site aparecem aqui.</p>
                  </div>
                ) : (
                  <div style={{overflowX:'auto'}}>
                    <table className="admin-table">
                      <thead><tr><th>Nome</th><th>Contacto</th><th>Serviço</th><th>Mensagem</th><th>Data</th><th>Estado</th><th></th></tr></thead>
                      <tbody>
                        {leads.map((l) => (
                          <tr key={l.id}>
                            <td style={{fontWeight:600}}>{l.nome}</td>
                            <td style={{fontSize:12}}>
                              <div>{l.email}</div>
                              {l.telefone && <div style={{color:'var(--ink-muted)'}}>{l.telefone}</div>}
                            </td>
                            <td>{l.servico || '—'}</td>
                            <td style={{maxWidth:240,fontSize:12,color:'var(--ink-soft)'}} title={l.mensagem}>
                              {(l.mensagem || '').length > 70 ? l.mensagem.slice(0, 70) + '…' : l.mensagem}
                            </td>
                            <td style={{fontSize:12,whiteSpace:'nowrap'}}>{fmtData(l.data)}</td>
                            <td>
                              <select
                                value={l.status || 'new'}
                                onChange={(e) => setLeadStatus(l.id, e.target.value)}
                                style={{padding:'5px 8px',borderRadius:8,border:'1px solid var(--line)',fontSize:12,fontWeight:600,background:'var(--bg-soft)',color:'var(--ink)'}}
                              >
                                {Object.entries(LEAD_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                              </select>
                            </td>
                            <td>
                              <div className="row-actions">
                                {l.telefone && (
                                  <a className="ra-btn" title="WhatsApp" target="_blank" rel="noreferrer"
                                     href={`https://wa.me/${(l.telefone||'').replace(/\D/g,'')}`}><i className="fa-brands fa-whatsapp" style={{fontSize:13,lineHeight:1}} aria-hidden="true" /></a>
                                )}
                                <a className="ra-btn" title="Responder por e-mail" href={`mailto:${l.email}?subject=${encodeURIComponent('Cari Tech Graphic — o seu pedido')}`}><FA name="reply" s={13} /></a>
                                <button className="ra-btn danger" title="Remover" onClick={() => deleteLead(l.id)}><Trash /></button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {tab === 'overview' && (
              <div className="admin-panel">
                <h2 style={{marginBottom:16}}>Resumo da actividade</h2>
                <p style={{color:'var(--ink-muted)',fontSize:14}}>Use a navegação à esquerda para gerir Serviços, Portfólio e Leads. Os indicadores acima mostram o estado actual em tempo real.</p>
              </div>
            )}

            {tab === 'settings' && (
              <div className="admin-panel">
                <h2 style={{marginBottom:16}}>Definições</h2>
                <p style={{color:'var(--ink-muted)',fontSize:14,marginBottom:20,lineHeight:1.6}}>
                  As configurações do site (e-mail que recebe os pedidos, WhatsApp, SMTP e palavra-passe deste painel)
                  ficam no ficheiro <code>config.php</code> no servidor, por segurança.
                </p>
                <div style={{display:'grid',gap:14,maxWidth:560}}>
                  <div style={{background:'var(--bg-soft)',borderRadius:12,padding:16,fontSize:13,lineHeight:1.6}}>
                    <strong><FA name="key" s={13} /> Mudar a palavra-passe do painel</strong>
                    <p style={{margin:'8px 0 0',color:'var(--ink-muted)'}}>
                      No terminal do servidor, gere um novo hash e cole-o em <code>config.php</code> → <code>admin_password_hash</code>:
                    </p>
                    <pre style={{background:'var(--brand-deep)',color:'#e5e5e5',padding:'10px 12px',borderRadius:8,fontSize:12,overflowX:'auto',marginTop:8}}>php -r 'echo password_hash("NOVA_SENHA", PASSWORD_DEFAULT);'</pre>
                  </div>
                  <div style={{background:'var(--bg-soft)',borderRadius:12,padding:16,fontSize:13,lineHeight:1.6}}>
                    <strong><FA name="circle-info" s={13} /> Serviços e Portfólio</strong>
                    <p style={{margin:'8px 0 0',color:'var(--ink-muted)'}}>
                      As abas Serviços e Portfólio são uma demonstração local (as alterações não são guardadas ao recarregar).
                      A aba <strong>Leads</strong> usa dados reais do site. Posso ligar Serviços/Portfólio a uma base de dados quando quiser.
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>

          {editing && (
            <div className="form-modal show" onClick={() => setEditing(null)}>
              <div className="form-shell" onClick={(e) => e.stopPropagation()}>
                <button className="form-close" onClick={() => setEditing(null)}><FA name="xmark" s={14} /></button>
                <h3>{editType === 'service' ? 'Serviço' : 'Projecto'}</h3>
                <div style={{display:'grid',gap:12}}>
                  {editType === 'service' ? (
                    <>
                      <div className="field"><label>Nome do serviço</label><input value={editing.name} onChange={(e) => setEditing({...editing, name: e.target.value})} /><div className="field-error"/></div>
                      <div className="field"><label>Categoria</label>
                        <select value={editing.category} onChange={(e) => setEditing({...editing, category: e.target.value})}>
                          <option value="design">Design</option><option value="web">Web</option><option value="marketing">Marketing</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                      <div className="field"><label>Preço</label><input value={editing.price} onChange={(e) => setEditing({...editing, price: e.target.value})} /><div className="field-error"/></div>
                      <div className="field"><label>Estado</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">Activo</option><option value="draft">Rascunho</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="field"><label>Título do projecto</label><input value={editing.title} onChange={(e) => setEditing({...editing, title: e.target.value})} /><div className="field-error"/></div>
                      <div className="field"><label>Cliente</label><input value={editing.client} onChange={(e) => setEditing({...editing, client: e.target.value})} /><div className="field-error"/></div>
                      <div className="field"><label>Categoria</label>
                        <select value={editing.tag} onChange={(e) => setEditing({...editing, tag: e.target.value})}>
                          <option value="web">Web</option><option value="design">Design</option><option value="marketing">Marketing</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                      <div className="field"><label>Ano</label><input type="number" value={editing.year} onChange={(e) => setEditing({...editing, year: +e.target.value})} /><div className="field-error"/></div>
                      <div className="field"><label>Estado</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">Publicado</option><option value="draft">Rascunho</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  )}
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <button className="btn btn-accent" onClick={save}>Guardar</button>
                    <button className="btn btn-ghost" onClick={() => setEditing(null)}>Cancelar</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
