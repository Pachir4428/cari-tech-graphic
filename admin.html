<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Cari Tech Graphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/styles-sections.css" />
  <link rel="stylesheet" href="assets/css/styles-modals.css" />
  <style>
    body { background: var(--bg-soft); }
    .admin-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }
    .admin-side {
      background: var(--brand-deep);
      color: #fff;
      padding: 24px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .admin-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }
    .admin-logo-mark {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff;
    }
    .admin-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px; font-weight: 500;
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      border: none;
      background: transparent;
      text-align: left;
    }
    .admin-nav-item:hover {
      color: #fff; background: rgba(255,255,255,0.05);
    }
    .admin-nav-item.active {
      background: var(--accent);
      color: #fff;
    }
    .admin-nav-item.active:hover { background: var(--accent); }
    .admin-foot {
      margin-top: auto;
      padding: 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
    .admin-foot a { color: var(--accent); }

    .admin-main {
      padding: 24px 32px 80px;
      overflow: auto;
    }
    .admin-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .admin-topbar h1 {
      font-size: 28px; letter-spacing: -0.02em;
    }
    .admin-topbar p { font-size: 13px; color: var(--ink-muted); margin: 4px 0 0; }

    .kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    .kpi {
      background: var(--bg-elev);
      border-radius: 16px; padding: 20px;
      border: 1px solid var(--line);
    }
    .kpi-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-muted);
    }
    .kpi-num {
      font-size: 32px; font-weight: 800;
      letter-spacing: -0.03em; margin-top: 8px;
    }
    .kpi-trend {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600;
      color: var(--success); margin-top: 6px;
    }

    .admin-panel {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
    }
    .admin-panel-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .admin-panel-head h2 { font-size: 20px; letter-spacing: -0.01em; }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table th, .admin-table td {
      padding: 14px 12px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }
    .admin-table th {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: var(--bg-soft);
    }
    .admin-table tbody tr:hover { background: var(--bg-soft); }
    .table-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }
    .tag-web { background: #3B82F6; }
    .tag-design { background: #A78BFA; }
    .tag-marketing { background: var(--accent); }
    .tag-active { background: var(--success); }
    .tag-draft { background: var(--ink-muted); }

    .row-actions {
      display: flex; gap: 6px;
    }
    .ra-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--ink-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
      border: none;
    }
    .ra-btn:hover { background: var(--accent); color: #fff; }
    .ra-btn.danger:hover { background: var(--danger); }

    .admin-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-soft);
      padding: 4px;
      border-radius: 999px;
      margin-bottom: 24px;
      width: fit-content;
    }
    .admin-tab {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
    }
    .admin-tab.active {
      background: var(--bg-elev);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-add:hover { transform: translateY(-1px); }

    .form-modal {
      position: fixed; inset: 0;
      background: rgba(2, 31, 33, 0.55);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
      z-index: 200;
    }
    .form-modal.show { display: flex; }
    .form-shell {
      background: var(--bg-elev);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      position: relative;
    }
    .form-shell h3 { font-size: 22px; margin-bottom: 20px; }
    .form-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }

    @media (max-width: 1024px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-side { flex-direction: row; padding: 12px; gap: 4px; overflow-x: auto; }
      .admin-logo { display: none; }
      .admin-foot { display: none; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .admin-main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ---- API do painel (admin-api.php) ----
    const api = async (action, method = 'GET', body = null) => {
      const opts = { method, headers: { 'Accept': 'application/json' }, credentials: 'same-origin' };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch(`admin-api.php?action=${action}`, opts);
      let data = {};
      try { data = await res.json(); } catch (e) {}
      return { status: res.status, ...data };
    };

    // Upload de ficheiros (logótipo, ZIP) — multipart.
    const apiUpload = async (action, formData) => {
      const res = await fetch(`admin-api.php?action=${action}`, {
        method: 'POST', body: formData, credentials: 'same-origin',
        headers: { 'Accept': 'application/json' },
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      return { status: res.status, ...data };
    };

    const LEAD_STATUS = {
      new:       { label: 'Novo',       cls: 'tag-marketing' },
      contacted: { label: 'Contactado', cls: 'tag-design' },
      won:       { label: 'Ganho',      cls: 'tag-active' },
      lost:      { label: 'Perdido',    cls: 'tag-draft' },
    };

    const fmtData = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const p = (n) => String(n).padStart(2, '0');
      return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };

    function FA({ name, s = 14, style = {} }) { return <i className={`fa-solid fa-${name}`} style={{fontSize:s,lineHeight:1,...style}} aria-hidden="true" />; }

    // ---- Ecrã de login ----
    function Login({ onOk }) {
      const [user, setUser] = useState('');
      const [pass, setPass] = useState('');
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      const submit = async (e) => {
        e.preventDefault();
        setBusy(true); setErr('');
        const r = await api('login', 'POST', { username: user, password: pass });
        setBusy(false);
        if (r.ok) onOk();
        else setErr(r.message || 'Falha na autenticação.');
      };
      return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,background:'var(--brand-deep)'}}>
          <form onSubmit={submit} style={{background:'var(--bg-elev)',borderRadius:20,padding:'40px 36px',width:'100%',maxWidth:380,boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:24}}>
              <div style={{width:40,height:40,background:'var(--accent)',borderRadius:12,display:'inline-flex',alignItems:'center',justifyContent:'center',fontWeight:800,color:'#fff',fontSize:18}}>C</div>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>Cari Tech</div>
                <div style={{fontSize:11,color:'var(--ink-muted)'}}>Painel de administração</div>
              </div>
            </div>
            <div className="field">
              <label>Utilizador</label>
              <input value={user} autoFocus onChange={(e) => setUser(e.target.value)} placeholder="admin" />
              <div className="field-error"/>
            </div>
            <div className="field">
              <label>Palavra-passe</label>
              <input type="password" value={pass} onChange={(e) => setPass(e.target.value)} placeholder="••••••••" />
              <div className="field-error">{err}</div>
            </div>
            <button type="submit" className="btn btn-accent" disabled={busy || !user || !pass} style={{width:'100%',justifyContent:'center',marginTop:8}}>
              {busy ? 'A entrar…' : 'Entrar'} <FA name="arrow-right-to-bracket" s={14} />
            </button>
          </form>
        </div>
      );
    }

    // Conteúdo padrão — igual ao que o site mostra por omissão (i18n).
    // t = título/nome (mostrado no site), d/c = descrição.
    const SEED_SERVICES = [
      { id: 1, t: 'Design Gráfico', d: 'Materiais visuais que fazem a sua marca ser lembrada — do print ao digital.', category: 'design', price: '15.000 MZN', status: 'active' },
      { id: 2, t: 'Desenvolvimento Web', d: 'Sites e plataformas rápidas, responsivas e otimizadas para conversão.', category: 'web', price: '80.000 MZN', status: 'active' },
      { id: 3, t: 'Marketing Digital', d: 'Campanhas que geram tráfego qualificado e leads reais para o seu negócio.', category: 'marketing', price: '25.000 MZN/mês', status: 'active' },
      { id: 4, t: 'Branding', d: 'Construímos identidades coerentes — do logo à voz da sua marca.', category: 'design', price: '120.000 MZN', status: 'active' },
      { id: 5, t: 'Redes Sociais', d: 'Gestão e produção de conteúdo que envolve a sua audiência diariamente.', category: 'marketing', price: '20.000 MZN/mês', status: 'active' },
      { id: 6, t: 'Soluções com IA', d: 'Automações inteligentes que economizam tempo e ampliam capacidade.', category: 'web', price: 'Sob consulta', status: 'active' },
    ];

    const SEED_PORTFOLIO = [
      { id: 1, t: 'Banco Horizonte', c: 'Plataforma de banking digital', tag: 'web', status: 'active', year: 2024 },
      { id: 2, t: 'Studio Mutuanha', c: 'Identidade visual completa', tag: 'design', status: 'active', year: 2024 },
      { id: 3, t: 'Café Naparama', c: 'Campanha de lançamento', tag: 'marketing', status: 'active', year: 2025 },
      { id: 4, t: 'Loja Quelimane+', c: 'E-commerce responsivo', tag: 'web', status: 'active', year: 2025 },
      { id: 5, t: 'Festival Macuti', c: 'Material gráfico do evento', tag: 'design', status: 'active', year: 2025 },
      { id: 6, t: 'TechMoz Insights', c: 'Estratégia de redes sociais', tag: 'marketing', status: 'active', year: 2025 },
    ];

    // Cabeçalhos padrão das secções — iguais aos do site (i18n).
    const SEED_HEADINGS = {
      services:  { eyebrow: 'Os nossos serviços', title: 'Tudo o que precisa para crescer online.', lede: 'Da identidade visual ao deploy. Seis áreas, uma equipa.' },
      portfolio: { eyebrow: 'Portfólio', title: 'Projectos recentes', lede: 'Uma seleção do trabalho da casa.' },
      testimonials: { eyebrow: 'Testemunhos', title: 'O que dizem os nossos clientes', lede: '' },
    };

    // Testemunhos padrão — iguais aos do site (i18n). Só os 3 primeiros activos aparecem.
    const SEED_TESTIMONIALS = [
      { id: 1, q: 'Entregaram a plataforma três semanas antes do prazo. Atenção ao detalhe que não vemos noutros estúdios em Moçambique.', n: 'Aida M.', r: 'CEO, Horizonte Lda.', status: 'active' },
      { id: 2, q: 'Reposicionaram a nossa marca por completo. As vendas subiram 40% no trimestre seguinte ao rebrand.', n: 'Carlos T.', r: 'Fundador, Studio Mutuanha', status: 'active' },
      { id: 3, q: 'A equipa percebe de negócio, não só de design. Foi a parceria que faltava ao Café Naparama.', n: 'Lúcia F.', r: 'Diretora de Marketing', status: 'active' },
    ];

    // Contactos padrão — iguais aos mostrados no site.
    const SEED_CONTACT = {
      email: 'contacto@caritechgraphic.com',
      phone: '+258 87 987 7200',
      whatsapp: '258834157731',
      address: 'Bairro Mutuanha, CP 3100, Nampula',
      hours: 'Seg–Sex · 08h–17h',
    };

    const CONTACT_FIELDS = [
      { k: 'email', label: 'E-mail', ph: 'contacto@seudominio.com' },
      { k: 'phone', label: 'Telefone (como aparece no site)', ph: '+258 87 987 7200' },
      { k: 'whatsapp', label: 'WhatsApp (só dígitos, formato internacional)', ph: '258834157731' },
      { k: 'address', label: 'Morada', ph: 'Bairro, cidade' },
      { k: 'hours', label: 'Horário', ph: 'Seg–Sex · 08h–17h' },
    ];

    function ContactEditor({ contact, onCommit, saveState }) {
      const [local, setLocal] = useState(contact);
      useEffect(() => { setLocal(contact); }, [contact]);
      const commit = (k) => { if ((local[k] || '') !== (contact[k] || '')) onCommit(k, local[k]); };
      return (
        <div className="admin-panel">
          <div className="admin-panel-head">
            <h2>Contactos do site</h2>
            <SaveHint state={saveState} />
          </div>
          <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>
            Estes contactos aparecem na secção Contacto, no rodapé, no botão de WhatsApp e nos formulários. Guardados automaticamente.
          </p>
          <div style={{display:'grid',gap:12,maxWidth:560}}>
            {CONTACT_FIELDS.map((f) => (
              <div className="field" key={f.k}>
                <label>{f.label}</label>
                <input value={local[f.k] || ''} placeholder={f.ph}
                  onChange={(e) => setLocal({ ...local, [f.k]: e.target.value })}
                  onBlur={() => commit(f.k)} />
                <div className="field-error"/>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Pencil({ s = 14 }) { return <i className="fa-solid fa-pen" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }
    function Trash({ s = 14 }) { return <i className="fa-solid fa-trash-can" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }
    function Eye({ s = 14 }) { return <i className="fa-solid fa-eye" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }
    function Plus({ s = 14 }) { return <i className="fa-solid fa-plus" style={{fontSize:s,lineHeight:1}} aria-hidden="true" />; }

    function SaveHint({ state }) {
      if (!state) return null;
      const map = {
        saving: { c: 'var(--ink-muted)', i: 'spinner', t: 'A guardar…' },
        saved:  { c: 'var(--success, #30a46c)', i: 'circle-check', t: 'Guardado' },
        error:  { c: 'var(--danger, #e5484d)', i: 'triangle-exclamation', t: 'Erro ao guardar' },
      };
      const s = map[state] || map.saving;
      return <span style={{fontSize:12,fontWeight:600,color:s.c,display:'inline-flex',alignItems:'center',gap:6}}><FA name={s.i} s={12} />{s.t}</span>;
    }

    function HeadingEditor({ heading, onCommit }) {
      const [local, setLocal] = useState(heading);
      useEffect(() => { setLocal(heading); }, [heading]);
      const commit = (f) => { if ((local[f] || '') !== (heading[f] || '')) onCommit(f, local[f]); };
      return (
        <div className="admin-panel" style={{marginBottom:16,background:'var(--bg-soft)'}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--ink-muted)',marginBottom:12}}>
            <FA name="heading" s={12} /> Cabeçalho da secção (aparece no site)
          </div>
          <div style={{display:'grid',gap:10,maxWidth:640}}>
            <div className="field"><label>Rótulo (eyebrow)</label><input value={local.eyebrow || ''} onChange={(e) => setLocal({...local, eyebrow: e.target.value})} onBlur={() => commit('eyebrow')} /><div className="field-error"/></div>
            <div className="field"><label>Título</label><input value={local.title || ''} onChange={(e) => setLocal({...local, title: e.target.value})} onBlur={() => commit('title')} /><div className="field-error"/></div>
            <div className="field"><label>Descrição</label><input value={local.lede || ''} onChange={(e) => setLocal({...local, lede: e.target.value})} onBlur={() => commit('lede')} /><div className="field-error"/></div>
          </div>
        </div>
      );
    }

    function Aviso({ msg }) {
      if (!msg) return null;
      return <p style={{marginTop:10,fontSize:13,fontWeight:600,color: msg.ok ? 'var(--success,#30a46c)' : 'var(--danger,#e5484d)'}}>{msg.text}</p>;
    }

    function AccountEditor({ username, onChanged }) {
      const [cur, setCur] = useState('');
      const [nu, setNu] = useState(username || 'admin');
      const [np, setNp] = useState('');
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      useEffect(() => { setNu(username || 'admin'); }, [username]);
      const submit = async (e) => {
        e.preventDefault();
        setBusy(true); setMsg(null);
        const r = await api('change-credentials', 'POST', { current_password: cur, username: nu, new_password: np });
        setBusy(false);
        if (r.ok) { setMsg({ ok: true, text: 'Credenciais actualizadas.' }); setCur(''); setNp(''); onChanged && onChanged(nu); }
        else setMsg({ ok: false, text: r.message || 'Erro.' });
      };
      return (
        <div className="admin-panel" style={{marginBottom:16}}>
          <h2 style={{marginBottom:6}}>Conta de acesso</h2>
          <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>Altere o utilizador e a palavra-passe deste painel. É pedida a palavra-passe actual por segurança.</p>
          <form onSubmit={submit} style={{display:'grid',gap:12,maxWidth:420}}>
            <div className="field"><label>Palavra-passe actual</label><input type="password" value={cur} onChange={(e) => setCur(e.target.value)} /><div className="field-error"/></div>
            <div className="field"><label>Novo utilizador</label><input value={nu} onChange={(e) => setNu(e.target.value)} placeholder="admin" /><div className="field-error"/></div>
            <div className="field"><label>Nova palavra-passe (mín. 6 caracteres)</label><input type="password" value={np} onChange={(e) => setNp(e.target.value)} /><div className="field-error"/></div>
            <button type="submit" className="btn btn-accent" disabled={busy || !cur || !nu || np.length < 6} style={{justifySelf:'start'}}>
              {busy ? 'A guardar…' : 'Guardar credenciais'}
            </button>
          </form>
          <Aviso msg={msg} />
        </div>
      );
    }

    function LogoManager({ branding, onChange }) {
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const fileRef = React.useRef(null);
      const logo = branding && branding.logo;
      const upload = async (file) => {
        if (!file) return;
        setBusy(true); setMsg(null);
        const fd = new FormData(); fd.append('logo', file);
        const r = await apiUpload('upload-logo', fd);
        setBusy(false);
        if (r.ok) { onChange({ logo: r.logo }); setMsg({ ok: true, text: 'Logótipo actualizado.' }); }
        else setMsg({ ok: false, text: r.message || 'Erro.' });
      };
      const remove = async () => {
        setBusy(true); setMsg(null);
        const r = await api('remove-logo', 'POST');
        setBusy(false);
        if (r.ok) { onChange({}); setMsg({ ok: true, text: 'Logótipo removido.' }); }
        else setMsg({ ok: false, text: r.message || 'Erro.' });
      };
      return (
        <div className="admin-panel" style={{marginBottom:16}}>
          <h2 style={{marginBottom:6}}>Logótipo do site</h2>
          <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>Aparece no cabeçalho e no rodapé (PNG, JPG, SVG… até 2 MB). Sem logótipo, é usado o símbolo padrão.</p>
          <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
            <div style={{height:56,minWidth:130,background:'var(--brand-deep)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 16px'}}>
              {logo ? <img src={logo} alt="logótipo" style={{height:40,width:'auto'}} /> : <span style={{color:'#fff',fontWeight:800,fontSize:13}}>Símbolo padrão</span>}
            </div>
            <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" style={{display:'none'}} onChange={(e) => upload(e.target.files[0])} />
            <button type="button" className="btn btn-accent" onClick={() => fileRef.current && fileRef.current.click()} disabled={busy}>
              <FA name="image" s={13} /> {busy ? 'A enviar…' : 'Carregar logótipo'}
            </button>
            {logo && <button type="button" className="btn btn-ghost" onClick={remove} disabled={busy}>Remover</button>}
          </div>
          <Aviso msg={msg} />
        </div>
      );
    }

    function SiteUpdater() {
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const [file, setFile] = useState(null);
      const submit = async () => {
        if (!file) return;
        if (!window.confirm('Atualizar o site com este ZIP? Os ficheiros serão substituídos. config.php, a pasta dados/ e uploads/ são preservados.')) return;
        setBusy(true); setMsg(null);
        const fd = new FormData(); fd.append('zip', file);
        const r = await apiUpload('update-zip', fd);
        setBusy(false);
        setMsg(r.ok ? { ok: true, text: r.message } : { ok: false, text: r.message || 'Erro ao atualizar.' });
        if (r.ok) setFile(null);
      };
      return (
        <div className="admin-panel" style={{marginBottom:16}}>
          <h2 style={{marginBottom:6}}>Atualizar o site (ZIP)</h2>
          <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:14}}>
            Envie um <code>.zip</code> com a nova versão. Os ficheiros são substituídos, mas
            <strong> config.php</strong>, a pasta <strong>dados/</strong> (leads e conteúdo) e
            <strong> uploads/</strong> (imagens/logótipo) são <strong>sempre preservados</strong>.
          </p>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            <input type="file" accept=".zip,application/zip" onChange={(e) => setFile(e.target.files[0] || null)} />
            <button type="button" className="btn btn-accent" onClick={submit} disabled={busy || !file}>
              <FA name="upload" s={13} /> {busy ? 'A atualizar…' : 'Atualizar site'}
            </button>
          </div>
          <Aviso msg={msg} />
          <div style={{marginTop:12,background:'#fff8e6',border:'1px solid #ffe08a',borderRadius:10,padding:'10px 14px',fontSize:12.5,color:'#7a5b00'}}>
            <strong>Dica:</strong> faça um backup (hPanel → Backups) antes de atualizar, por precaução.
          </div>
        </div>
      );
    }

    function App() {
      const [authed, setAuthed] = useState(null); // null = a verificar
      const [tab, setTab] = useState('leads');
      const [services, setServices] = useState(SEED_SERVICES);
      const [portfolio, setPortfolio] = useState(SEED_PORTFOLIO);
      const [headings, setHeadings] = useState(SEED_HEADINGS);
      const [contact, setContact] = useState(SEED_CONTACT);
      const [testimonials, setTestimonials] = useState(SEED_TESTIMONIALS);
      const [branding, setBranding] = useState({});
      const [username, setUsername] = useState('admin');
      const [leads, setLeads] = useState([]);
      const [leadsLoading, setLeadsLoading] = useState(false);
      const [editing, setEditing] = useState(null);
      const [editType, setEditType] = useState('');
      const [saveState, setSaveState] = useState(''); // '' | 'saving' | 'saved' | 'error'

      const loadLeads = async () => {
        setLeadsLoading(true);
        const r = await api('leads');
        setLeadsLoading(false);
        if (r.ok) setLeads(r.leads || []);
        else if (r.status === 401) setAuthed(false);
      };

      // Carrega o conteúdo gerido (Serviços/Portfólio). Se ainda não houver
      // nada guardado, mantém os valores padrão (SEED).
      const loadContent = async () => {
        const r = await api('content');
        if (r.ok) {
          if (Array.isArray(r.services)) setServices(r.services);
          if (Array.isArray(r.portfolio)) setPortfolio(r.portfolio);
          if (Array.isArray(r.testimonials)) setTestimonials(r.testimonials);
          if (r.headings && (r.headings.services || r.headings.portfolio || r.headings.testimonials)) {
            setHeadings({ ...SEED_HEADINGS, ...r.headings });
          }
          if (r.contact && Object.keys(r.contact).length) {
            setContact({ ...SEED_CONTACT, ...r.contact });
          }
          if (r.branding) setBranding(r.branding);
          if (r.username) setUsername(r.username);
        }
      };

      // Grava o conteúdo actual no servidor (usado pelo site público).
      // Recebe um objecto com apenas os campos alterados; o resto usa o estado actual.
      const persist = async (over = {}) => {
        setSaveState('saving');
        const r = await api('content-save', 'POST', {
          services: over.services || services,
          portfolio: over.portfolio || portfolio,
          testimonials: over.testimonials || testimonials,
          headings: over.headings || headings,
          contact: over.contact || contact,
        });
        setSaveState(r.ok ? 'saved' : 'error');
        if (r.ok) setTimeout(() => setSaveState(''), 2500);
      };

      // Actualiza um campo de cabeçalho e grava.
      const updateHeading = (sec, field, value) => {
        const next = { ...headings, [sec]: { ...headings[sec], [field]: value } };
        setHeadings(next);
        persist({ headings: next });
      };

      // Actualiza um contacto e grava.
      const updateContact = (field, value) => {
        const next = { ...contact, [field]: value };
        setContact(next);
        persist({ contact: next });
      };

      // Ao arrancar, verifica a sessão
      useEffect(() => {
        api('session').then((r) => {
          const ok = !!r.authenticated;
          setAuthed(ok);
          if (ok) { loadLeads(); loadContent(); }
        });
      }, []);

      const logout = async () => { await api('logout', 'POST'); setAuthed(false); setLeads([]); };

      const setLeadStatus = async (id, status) => {
        setLeads((ls) => ls.map((l) => l.id === id ? { ...l, status } : l)); // optimista
        const r = await api('lead-status', 'POST', { id, status });
        if (!r.ok) loadLeads();
      };
      const deleteLead = async (id) => {
        if (!window.confirm('Remover este lead? Esta acção não pode ser desfeita.')) return;
        setLeads((ls) => ls.filter((l) => l.id !== id));
        const r = await api('lead-delete', 'POST', { id });
        if (!r.ok) loadLeads();
      };

      if (authed === null) {
        return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-muted)'}}>A carregar…</div>;
      }
      if (!authed) {
        return <Login onOk={() => { setAuthed(true); loadLeads(); loadContent(); }} />;
      }

      const NEW_ITEM = {
        service: () => ({ id: Date.now(), t: '', d: '', category: 'design', price: '', status: 'active' }),
        portfolio: () => ({ id: Date.now(), t: '', c: '', tag: 'web', status: 'active', year: new Date().getFullYear() }),
        testimonial: () => ({ id: Date.now(), q: '', n: '', r: '', status: 'active' }),
      };
      const openNew = (type) => { setEditType(type); setEditing(NEW_ITEM[type]()); };
      const openEdit = (type, item) => { setEditType(type); setEditing({ ...item }); };

      const upsert = (list, item) => list.find((x) => x.id === item.id)
        ? list.map((x) => x.id === item.id ? item : x)
        : [...list, item];

      const save = () => {
        if (editType === 'service') {
          const next = upsert(services, editing); setServices(next); persist({ services: next });
        } else if (editType === 'portfolio') {
          const next = upsert(portfolio, editing); setPortfolio(next); persist({ portfolio: next });
        } else {
          const next = upsert(testimonials, editing); setTestimonials(next); persist({ testimonials: next });
        }
        setEditing(null);
      };
      const remove = (type, id) => {
        if (type === 'service') { const next = services.filter((x) => x.id !== id); setServices(next); persist({ services: next }); }
        else if (type === 'portfolio') { const next = portfolio.filter((x) => x.id !== id); setPortfolio(next); persist({ portfolio: next }); }
        else { const next = testimonials.filter((x) => x.id !== id); setTestimonials(next); persist({ testimonials: next }); }
      };

      const kpis = [
        { l: 'Total de leads', v: leads.length },
        { l: 'Leads novos', v: leads.filter((l) => l.status === 'new').length },
        { l: 'Ganhos', v: leads.filter((l) => l.status === 'won').length },
        { l: 'Projectos', v: portfolio.length },
      ];

      return (
        <div className="admin-shell">
          <aside className="admin-side">
            <div className="admin-logo">
              <div className="admin-logo-mark">C</div>
              <div>
                <div style={{fontWeight:800,fontSize:14}}>Cari Tech</div>
                <div style={{fontSize:10,opacity:0.6}}>Admin Panel</div>
              </div>
            </div>
            <button className={`admin-nav-item ${tab === 'overview' ? 'active' : ''}`} onClick={() => setTab('overview')}><FA name="gauge-high" s={15} />Visão geral</button>
            <button className={`admin-nav-item ${tab === 'services' ? 'active' : ''}`} onClick={() => setTab('services')}><FA name="layer-group" s={15} />Serviços</button>
            <button className={`admin-nav-item ${tab === 'portfolio' ? 'active' : ''}`} onClick={() => setTab('portfolio')}><FA name="folder-open" s={15} />Portfólio</button>
            <button className={`admin-nav-item ${tab === 'testimonials' ? 'active' : ''}`} onClick={() => setTab('testimonials')}><FA name="quote-right" s={15} />Testemunhos</button>
            <button className={`admin-nav-item ${tab === 'leads' ? 'active' : ''}`} onClick={() => setTab('leads')}><FA name="inbox" s={15} />Leads</button>
            <button className={`admin-nav-item ${tab === 'contact' ? 'active' : ''}`} onClick={() => setTab('contact')}><FA name="address-book" s={15} />Contactos</button>
            <button className={`admin-nav-item ${tab === 'settings' ? 'active' : ''}`} onClick={() => setTab('settings')}><FA name="gear" s={15} />Definições</button>
            <button className="admin-nav-item" onClick={logout} style={{marginTop:8}}><FA name="arrow-right-from-bracket" s={15} />Terminar sessão</button>
            <div className="admin-foot">
              Sessão activa<br/>
              <a href="index.html"><FA name="arrow-left" s={11} /> Ver site público</a>
            </div>
          </aside>

          <main className="admin-main">
            <div className="admin-topbar">
              <div>
                <h1>{tab === 'overview' ? 'Visão geral' : tab === 'services' ? 'Gestão de Serviços' : tab === 'portfolio' ? 'Gestão de Portfólio' : tab === 'testimonials' ? 'Gestão de Testemunhos' : tab === 'leads' ? 'Pedidos & Leads' : tab === 'contact' ? 'Contactos' : 'Definições'}</h1>
                <p>Bem-vindo de volta. Aqui está o estado actual da Cari Tech.</p>
              </div>
              <a className="btn-add" href="index.html" target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>
                <FA name="up-right-from-square" s={13} />Ver site
              </a>
            </div>

            <div className="kpi-row">
              {kpis.map((k, i) => (
                <div className="kpi" key={i}>
                  <div className="kpi-label">{k.l}</div>
                  <div className="kpi-num">{k.v}</div>
                </div>
              ))}
            </div>

            {tab === 'services' && (
              <>
              <HeadingEditor heading={headings.services} onCommit={(f, v) => updateHeading('services', f, v)} />
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>Serviços oferecidos</h2>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <SaveHint state={saveState} />
                    <button className="btn-add" onClick={() => openNew('service')}><Plus />Novo serviço</button>
                  </div>
                </div>
                <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>Estes serviços aparecem no site público. As alterações são guardadas automaticamente.</p>
                <div style={{overflowX:'auto'}}>
                  <table className="admin-table">
                    <thead><tr><th>Serviço</th><th>Categoria</th><th>Preço</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                      {services.map((s) => (
                        <tr key={s.id}>
                          <td>
                            <div style={{fontWeight:600}}>{s.t}</div>
                            <div style={{fontSize:12,color:'var(--ink-muted)',maxWidth:340}}>{s.d}</div>
                          </td>
                          <td><span className={`table-tag tag-${s.category}`}>{s.category}</span></td>
                          <td style={{whiteSpace:'nowrap'}}>{s.price}</td>
                          <td><span className={`table-tag tag-${s.status}`}>{s.status === 'active' ? 'Activo' : 'Rascunho'}</span></td>
                          <td><div className="row-actions">
                            <button className="ra-btn" onClick={() => openEdit('service', s)}><Pencil /></button>
                            <button className="ra-btn danger" onClick={() => remove('service', s.id)}><Trash /></button>
                          </div></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              </>
            )}

            {tab === 'portfolio' && (
              <>
              <HeadingEditor heading={headings.portfolio} onCommit={(f, v) => updateHeading('portfolio', f, v)} />
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>Projectos do portfólio</h2>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <SaveHint state={saveState} />
                    <button className="btn-add" onClick={() => openNew('portfolio')}><Plus />Novo projecto</button>
                  </div>
                </div>
                <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>Estes projectos aparecem no site público. As alterações são guardadas automaticamente.</p>
                <div style={{overflowX:'auto'}}>
                  <table className="admin-table">
                    <thead><tr><th>Projecto</th><th>Descrição</th><th>Categoria</th><th>Ano</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                      {portfolio.map((p) => (
                        <tr key={p.id}>
                          <td style={{fontWeight:600}}>{p.t}</td>
                          <td style={{fontSize:12,color:'var(--ink-soft)',maxWidth:280}}>{p.c}</td>
                          <td><span className={`table-tag tag-${p.tag}`}>{p.tag}</span></td>
                          <td>{p.year}</td>
                          <td><span className={`table-tag tag-${p.status}`}>{p.status === 'active' ? 'Publicado' : 'Rascunho'}</span></td>
                          <td><div className="row-actions">
                            <button className="ra-btn" onClick={() => openEdit('portfolio', p)}><Pencil /></button>
                            <button className="ra-btn danger" onClick={() => remove('portfolio', p.id)}><Trash /></button>
                          </div></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              </>
            )}

            {tab === 'testimonials' && (
              <>
              <HeadingEditor heading={headings.testimonials} onCommit={(f, v) => updateHeading('testimonials', f, v)} />
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>Testemunhos de clientes</h2>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <SaveHint state={saveState} />
                    <button className="btn-add" onClick={() => openNew('testimonial')}><Plus />Novo testemunho</button>
                  </div>
                </div>
                <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>Os 3 primeiros testemunhos activos aparecem no site. Guardado automaticamente.</p>
                <div style={{overflowX:'auto'}}>
                  <table className="admin-table">
                    <thead><tr><th>Depoimento</th><th>Cliente</th><th>Cargo</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                      {testimonials.map((it) => (
                        <tr key={it.id}>
                          <td style={{fontSize:12,color:'var(--ink-soft)',maxWidth:360}}>“{(it.q || '').length > 90 ? it.q.slice(0, 90) + '…' : it.q}”</td>
                          <td style={{fontWeight:600}}>{it.n}</td>
                          <td style={{fontSize:12,color:'var(--ink-muted)'}}>{it.r}</td>
                          <td><span className={`table-tag tag-${it.status}`}>{it.status === 'active' ? 'Activo' : 'Rascunho'}</span></td>
                          <td><div className="row-actions">
                            <button className="ra-btn" onClick={() => openEdit('testimonial', it)}><Pencil /></button>
                            <button className="ra-btn danger" onClick={() => remove('testimonial', it.id)}><Trash /></button>
                          </div></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              </>
            )}

            {tab === 'leads' && (
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>Pedidos dos clientes</h2>
                  <button className="btn-add" onClick={loadLeads} style={{background:'var(--bg-soft)',color:'var(--ink)'}}>
                    <FA name="rotate" s={13} />Actualizar
                  </button>
                </div>
                {leadsLoading ? (
                  <p style={{color:'var(--ink-muted)',fontSize:14,padding:'20px 0'}}>A carregar pedidos…</p>
                ) : leads.length === 0 ? (
                  <div style={{textAlign:'center',padding:'48px 20px',color:'var(--ink-muted)'}}>
                    <FA name="inbox" s={40} style={{opacity:0.3}} />
                    <p style={{marginTop:14,fontSize:15,fontWeight:600}}>Ainda não há pedidos.</p>
                    <p style={{fontSize:13}}>Os contactos enviados pelo formulário do site aparecem aqui.</p>
                  </div>
                ) : (
                  <div style={{overflowX:'auto'}}>
                    <table className="admin-table">
                      <thead><tr><th>Nome</th><th>Contacto</th><th>Serviço</th><th>Mensagem</th><th>Data</th><th>Estado</th><th></th></tr></thead>
                      <tbody>
                        {leads.map((l) => (
                          <tr key={l.id}>
                            <td style={{fontWeight:600}}>{l.nome}</td>
                            <td style={{fontSize:12}}>
                              <div>{l.email}</div>
                              {l.telefone && <div style={{color:'var(--ink-muted)'}}>{l.telefone}</div>}
                            </td>
                            <td>{l.servico || '—'}</td>
                            <td style={{maxWidth:240,fontSize:12,color:'var(--ink-soft)'}} title={l.mensagem}>
                              {(l.mensagem || '').length > 70 ? l.mensagem.slice(0, 70) + '…' : l.mensagem}
                            </td>
                            <td style={{fontSize:12,whiteSpace:'nowrap'}}>{fmtData(l.data)}</td>
                            <td>
                              <select
                                value={l.status || 'new'}
                                onChange={(e) => setLeadStatus(l.id, e.target.value)}
                                style={{padding:'5px 8px',borderRadius:8,border:'1px solid var(--line)',fontSize:12,fontWeight:600,background:'var(--bg-soft)',color:'var(--ink)'}}
                              >
                                {Object.entries(LEAD_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                              </select>
                            </td>
                            <td>
                              <div className="row-actions">
                                {l.telefone && (
                                  <a className="ra-btn" title="WhatsApp" target="_blank" rel="noreferrer"
                                     href={`https://wa.me/${(l.telefone||'').replace(/\D/g,'')}`}><i className="fa-brands fa-whatsapp" style={{fontSize:13,lineHeight:1}} aria-hidden="true" /></a>
                                )}
                                <a className="ra-btn" title="Responder por e-mail" href={`mailto:${l.email}?subject=${encodeURIComponent('Cari Tech Graphic — o seu pedido')}`}><FA name="reply" s={13} /></a>
                                <button className="ra-btn danger" title="Remover" onClick={() => deleteLead(l.id)}><Trash /></button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {tab === 'contact' && (
              <ContactEditor contact={contact} onCommit={updateContact} saveState={saveState} />
            )}

            {tab === 'overview' && (
              <div className="admin-panel">
                <h2 style={{marginBottom:16}}>Resumo da actividade</h2>
                <p style={{color:'var(--ink-muted)',fontSize:14}}>Use a navegação à esquerda para gerir Serviços, Portfólio e Leads. Os indicadores acima mostram o estado actual em tempo real.</p>
              </div>
            )}

            {tab === 'settings' && (
              <>
                <AccountEditor username={username} onChanged={setUsername} />
                <LogoManager branding={branding} onChange={setBranding} />
                <SiteUpdater />
                <div className="admin-panel">
                  <h2 style={{marginBottom:12}}>Sobre o painel</h2>
                  <p style={{color:'var(--ink-muted)',fontSize:13,lineHeight:1.6,marginBottom:12}}>
                    Tudo é guardado no servidor e reflectido no site: <strong>Serviços</strong>, <strong>Projectos</strong> e
                    <strong> Testemunhos</strong> (com cabeçalhos editáveis), os <strong>Contactos</strong>, o <strong>Logótipo</strong>
                    e os <strong>Leads</strong> do formulário. Itens em "Rascunho" ficam ocultos no site.
                  </p>
                  <p style={{color:'var(--ink-muted)',fontSize:13,lineHeight:1.6}}>
                    O e-mail que recebe os pedidos, o SMTP e a base de dados configuram-se no ficheiro
                    <code> config.php</code> no servidor.
                  </p>
                </div>
              </>
            )}
          </main>

          {editing && (
            <div className="form-modal show" onClick={() => setEditing(null)}>
              <div className="form-shell" onClick={(e) => e.stopPropagation()}>
                <button className="form-close" onClick={() => setEditing(null)}><FA name="xmark" s={14} /></button>
                <h3>{editType === 'service' ? 'Serviço' : editType === 'portfolio' ? 'Projecto' : 'Testemunho'}</h3>
                <div style={{display:'grid',gap:12}}>
                  {editType === 'service' ? (
                    <>
                      <div className="field"><label>Nome do serviço</label><input value={editing.t} onChange={(e) => setEditing({...editing, t: e.target.value})} placeholder="Ex.: Design Gráfico" /><div className="field-error"/></div>
                      <div className="field"><label>Descrição (aparece no site)</label><textarea rows="3" value={editing.d} onChange={(e) => setEditing({...editing, d: e.target.value})} placeholder="Uma frase que descreve o serviço." /><div className="field-error"/></div>
                      <div className="field"><label>Categoria</label>
                        <select value={editing.category} onChange={(e) => setEditing({...editing, category: e.target.value})}>
                          <option value="design">Design</option><option value="web">Web</option><option value="marketing">Marketing</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                      <div className="field"><label>Preço (referência interna)</label><input value={editing.price} onChange={(e) => setEditing({...editing, price: e.target.value})} placeholder="Ex.: 15.000 MZN" /><div className="field-error"/></div>
                      <div className="field"><label>Estado</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">Activo (visível no site)</option><option value="draft">Rascunho (oculto)</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  ) : editType === 'portfolio' ? (
                    <>
                      <div className="field"><label>Título do projecto</label><input value={editing.t} onChange={(e) => setEditing({...editing, t: e.target.value})} placeholder="Ex.: Banco Horizonte" /><div className="field-error"/></div>
                      <div className="field"><label>Descrição (aparece no site)</label><input value={editing.c} onChange={(e) => setEditing({...editing, c: e.target.value})} placeholder="Ex.: Plataforma de banking digital" /><div className="field-error"/></div>
                      <div className="field"><label>Categoria</label>
                        <select value={editing.tag} onChange={(e) => setEditing({...editing, tag: e.target.value})}>
                          <option value="web">Web</option><option value="design">Design</option><option value="marketing">Marketing</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                      <div className="field"><label>Ano</label><input type="number" value={editing.year} onChange={(e) => setEditing({...editing, year: +e.target.value})} /><div className="field-error"/></div>
                      <div className="field"><label>Estado</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">Publicado (visível no site)</option><option value="draft">Rascunho (oculto)</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="field"><label>Depoimento</label><textarea rows="4" value={editing.q} onChange={(e) => setEditing({...editing, q: e.target.value})} placeholder="O que o cliente disse sobre o vosso trabalho." /><div className="field-error"/></div>
                      <div className="field"><label>Nome do cliente</label><input value={editing.n} onChange={(e) => setEditing({...editing, n: e.target.value})} placeholder="Ex.: Aida M." /><div className="field-error"/></div>
                      <div className="field"><label>Cargo / empresa</label><input value={editing.r} onChange={(e) => setEditing({...editing, r: e.target.value})} placeholder="Ex.: CEO, Horizonte Lda." /><div className="field-error"/></div>
                      <div className="field"><label>Estado</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">Activo (visível no site)</option><option value="draft">Rascunho (oculto)</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  )}
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <button className="btn btn-accent" onClick={save}>Guardar</button>
                    <button className="btn btn-ghost" onClick={() => setEditing(null)}>Cancelar</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
