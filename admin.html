    // Idioma activo (global) para as componentes fora de App usarem AT().
    let ADMIN_LANG = localStorage.getItem('ctg_admin_lang') || 'pt';
    const AT = (k) => (ADMIN_I18N[ADMIN_LANG] || ADMIN_I18N.pt)[k] || k;

    function App() {
      const [authed, setAuthed] = useState(null); // null = a verificar
      const [theme, setTheme] = useState(localStorage.getItem('ctg_admin_theme') || 'light');
      const [lang, setLang] = useState(localStorage.getItem('ctg_admin_lang') || 'pt');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [search, setSearch] = useState('');
      const [notifOpen, setNotifOpen] = useState(false);
      const prevNewRef = React.useRef(-1);
      const T = ADMIN_I18N[lang] || ADMIN_I18N.pt;
      ADMIN_LANG = lang; // mantém as componentes fora de App (AT) no mesmo idioma
      const [tab, setTab] = useState('overview');
      const [services, setServices] = useState(SEED_SERVICES);
      const [portfolio, setPortfolio] = useState(SEED_PORTFOLIO);
      const [headings, setHeadings] = useState(SEED_HEADINGS);
      const [contact, setContact] = useState(SEED_CONTACT);
      const [testimonials, setTestimonials] = useState(SEED_TESTIMONIALS);
      const [branding, setBranding] = useState({});
      const [payments, setPayments] = useState({});
      const [mozpayment, setMozpayment] = useState({});
      const [social, setSocial] = useState({});
      const [sites, setSites] = useState([]);
      const [seg, setSeg] = useState({});
      const [smtp, setSmtp] = useState({});
      const [username, setUsername] = useState('admin');
      const [leads, setLeads] = useState([]);
      const [leadsLoading, setLeadsLoading] = useState(false);
      const [editing, setEditing] = useState(null);
      const [editType, setEditType] = useState('');
      const [saveState, setSaveState] = useState(''); // '' | 'saving' | 'saved' | 'error'
      const [deliveries, setDeliveries] = useState({});       // { leadId: entrega }
      const [delivering, setDelivering] = useState(null);     // lead a ser entregue
      const [dForm, setDForm] = useState({ msg: '', entregas: [] });
      const [dBusy, setDBusy] = useState(false);
      const [dSaved, setDSaved] = useState(false);
      const [dReply, setDReply] = useState('');
      const [dPago, setDPago] = useState('nao');           // estado de pagamento: nao | parcial | pago

      // Tema (claro/escuro) e idioma do painel — persistidos no navegador.
      useEffect(() => { document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('ctg_admin_theme', theme); }, [theme]);
      useEffect(() => { localStorage.setItem('ctg_admin_lang', lang); }, [lang]);
      // Fecha o menu lateral (mobile) ao mudar de separador.
      useEffect(() => { setSidebarOpen(false); }, [tab]);

      // Notificações: pede permissão e verifica novos pedidos periodicamente.
      useEffect(() => {
        if (authed !== true) return;
        if ('Notification' in window && Notification.permission === 'default') {
          try { Notification.requestPermission(); } catch (e) {}
        }
        const id = setInterval(() => { loadLeads(); }, 45000);
        return () => clearInterval(id);
      }, [authed]);

      // Quando o nº de leads novos aumenta, mostra uma notificação do navegador.
      useEffect(() => {
        const n = leads.filter((l) => (l.status || 'new') === 'new').length;
        if (prevNewRef.current >= 0 && n > prevNewRef.current && 'Notification' in window && Notification.permission === 'granted') {
          const latest = leads.find((l) => (l.status || 'new') === 'new');
          try { new Notification(T.notifNewTitle, { body: latest ? `${latest.nome} — ${latest.servico || latest.email}` : T.notifNewBody }); } catch (e) {}
        }
        prevNewRef.current = n;
      }, [leads]);

      const loadLeads = async () => {
        setLeadsLoading(true);
        const r = await api('leads');
        setLeadsLoading(false);
        if (r.ok) setLeads(r.leads || []);
        else if (r.status === 401) setAuthed(false);
      };

      const loadDeliveries = async () => {
        const r = await api('deliveries');
        if (r.ok) setDeliveries(r.deliveries || {});
      };

      // Carrega o conteúdo gerido (Serviços/Portfólio). Se ainda não houver
      // nada guardado, mantém os valores padrão (SEED).
      const loadContent = async () => {
        const r = await api('content');
        if (r.ok) {
          if (Array.isArray(r.services)) setServices(r.services);
          if (Array.isArray(r.portfolio)) setPortfolio(r.portfolio);
          if (Array.isArray(r.testimonials)) setTestimonials(r.testimonials);
          if (r.headings && (r.headings.services || r.headings.portfolio || r.headings.testimonials)) {
            setHeadings({ ...SEED_HEADINGS, ...r.headings });
          }
          if (r.contact && Object.keys(r.contact).length) {
            setContact({ ...SEED_CONTACT, ...r.contact });
          }
          if (r.branding) setBranding(r.branding);
          if (r.payments) setPayments(r.payments);
          if (r.mozpayment) setMozpayment(r.mozpayment);
          if (r.social) setSocial(r.social);
          if (Array.isArray(r.sites)) setSites(r.sites);
          if (r.seg) setSeg(r.seg);
          if (r.smtp) setSmtp(r.smtp);
          if (r.username) setUsername(r.username);
        }
      };

      // Grava o conteúdo actual no servidor (usado pelo site público).
      // Recebe um objecto com apenas os campos alterados; o resto usa o estado actual.
      const persist = async (over = {}) => {
        setSaveState('saving');
        const r = await api('content-save', 'POST', {
          services: over.services || services,
          portfolio: over.portfolio || portfolio,
          testimonials: over.testimonials || testimonials,
          headings: over.headings || headings,
          contact: over.contact || contact,
        });
        setSaveState(r.ok ? 'saved' : 'error');
        if (r.ok) setTimeout(() => setSaveState(''), 2500);
      };

      // Actualiza um campo de cabeçalho e grava.
      const updateHeading = (sec, field, value) => {
        const next = { ...headings, [sec]: { ...headings[sec], [field]: value } };
        setHeadings(next);
        persist({ headings: next });
      };

      // Actualiza um contacto e grava.
      const updateContact = (field, value) => {
        const next = { ...contact, [field]: value };
        setContact(next);
        persist({ contact: next });
      };

      // Ao arrancar, verifica a sessão
      useEffect(() => {
        api('session').then((r) => {
          const ok = !!r.authenticated;
          setAuthed(ok);
          if (ok) { loadLeads(); loadContent(); loadDeliveries(); }
        });
      }, []);

      const logout = async () => { await api('logout', 'POST'); setAuthed(false); setLeads([]); };

      const setLeadStatus = async (id, status) => {
        setLeads((ls) => ls.map((l) => l.id === id ? { ...l, status } : l)); // optimista
        const r = await api('lead-status', 'POST', { id, status });
        if (!r.ok) loadLeads();
      };
      // Relatório de leads em CSV (abre no Excel/Sheets).
      const downloadLeadsCSV = () => {
        const rows = [['Data','Nome','E-mail','Telefone','Serviço','Estado','Código','Mensagem']];
        const estados = { new: T.sNew, contacted: T.sContacted, won: T.sWon, lost: T.sLost };
        leads.forEach((l) => rows.push([
          fmtData(l.data), l.nome || '', l.email || '', l.telefone || '', l.servico || '',
          estados[l.status || 'new'] || (l.status || ''), l.codigo || '', (l.mensagem || '').replace(/\s+/g, ' ').trim(),
        ]));
        const csv = '﻿' + rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `leads-cari-tech-${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
      };

      const deleteLead = async (id) => {
        if (!window.confirm(T.confirmDelLead)) return;
        setLeads((ls) => ls.filter((l) => l.id !== id));
        const r = await api('lead-delete', 'POST', { id });
        if (!r.ok) loadLeads();
      };

      // ---- Entregas (Área de Cliente) ----
      const siteBase = () => window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '');
      const openDeliver = (lead) => {
        const ex = deliveries[lead.id];
        setDForm({ msg: (ex && ex.msg) || '', entregas: (ex && ex.entregas) ? ex.entregas.map((e) => ({ ...e })) : [] });
        setDPago((ex && ex.pago) || 'nao');
        setDSaved(false);
        setDReply('');
        setDelivering(lead);
      };
      // Actualiza o estado de pagamento (habilita/bloqueia descargas na Área de Cliente)
      const dSetPago = async (estado) => {
        setDPago(estado);
        const r = await api('lead-pago', 'POST', { leadId: delivering.id, pago: estado });
        if (r.ok) setDeliveries((d) => ({ ...d, [delivering.id]: { ...(d[delivering.id] || { leadId: delivering.id }), pago: estado } }));
      };
      const dUploadFile = async (file) => {
        if (!file) return;
        setDBusy(true);
        const fd = new FormData(); fd.append('file', file);
        const r = await apiUpload('upload-file', fd);
        setDBusy(false);
        if (r.ok) setDForm((f) => ({ ...f, entregas: [...f.entregas, { tipo: 'file', url: r.url, nome: r.nome, note: '' }] }));
        else window.alert(r.message || AT('upError'));
      };
      const dAddLink = () => setDForm((f) => ({ ...f, entregas: [...f.entregas, { tipo: 'link', url: '', nome: '', note: '' }] }));
      const dUpdateItem = (i, k, v) => setDForm((f) => ({ ...f, entregas: f.entregas.map((e, idx) => idx === i ? { ...e, [k]: v } : e) }));
      const dRemoveItem = (i) => setDForm((f) => ({ ...f, entregas: f.entregas.filter((_, idx) => idx !== i) }));
      const dSave = async () => {
        const entregas = dForm.entregas.filter((e) => (e.url || '').trim());
        setDBusy(true);
        const r = await api('lead-deliver', 'POST', { leadId: delivering.id, msg: dForm.msg, entregas, pago: dPago });
        setDBusy(false);
        if (r.ok) {
          setDeliveries((d) => ({ ...d, [delivering.id]: r.delivery }));
          if (entregas.length) setLeads((ls) => ls.map((l) => l.id === delivering.id ? { ...l, status: 'won' } : l));
          setDSaved(true);
        } else window.alert(r.message || T.dlvErr);
      };
      const dSendReply = async () => {
        const texto = dReply.trim();
        if (!texto || !delivering) return;
        setDBusy(true);
        const r = await api('lead-comment', 'POST', { leadId: delivering.id, texto });
        setDBusy(false);
        if (r.ok) {
          setDeliveries((d) => ({ ...d, [delivering.id]: { ...(d[delivering.id] || { leadId: delivering.id }), comentarios: r.comentarios } }));
          setDReply('');
        } else window.alert(r.message || T.genErr);
      };
      const dNotifyMsg = (l) => T.dlvNotifyMsg
        .replace('{nome}', l.nome || '').replace('{url}', siteBase())
        .replace('{email}', l.email || '').replace('{codigo}', l.codigo || '');
      const dNotifyWhats = (l) => window.open(`https://wa.me/${String(l.telefone || '').replace(/\D/g, '')}?text=${encodeURIComponent(dNotifyMsg(l))}`, '_blank', 'noopener');
      const dNotifyMail = (l) => window.open(`mailto:${l.email}?subject=${encodeURIComponent('Cari Tech Graphic — a sua entrega está pronta')}&body=${encodeURIComponent(dNotifyMsg(l))}`, '_blank');

      if (authed === null) {
        return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-muted)'}}>{T.loading}</div>;
      }
      if (!authed) {
        // Login unificado: o acesso ao painel faz-se sempre por entrar.html.
        window.location.replace('entrar.html');
        return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-muted)'}}>{T.loading}</div>;
      }

      const NEW_ITEM = {
        service: () => ({ id: Date.now(), t: '', d: '', category: 'design', price: '', status: 'active', img: '' }),
        portfolio: () => ({ id: Date.now(), t: '', c: '', tag: 'web', status: 'active', year: new Date().getFullYear(), img: '', url: '' }),
        testimonial: () => ({ id: Date.now(), q: '', n: '', r: '', status: 'active', img: '' }),
      };
      const openNew = (type) => { setEditType(type); setEditing(NEW_ITEM[type]()); };
      const openEdit = (type, item) => { setEditType(type); setEditing({ ...item }); };

      const upsert = (list, item) => list.find((x) => x.id === item.id)
        ? list.map((x) => x.id === item.id ? item : x)
        : [...list, item];

      const save = () => {
        if (editType === 'service') {
          const next = upsert(services, editing); setServices(next); persist({ services: next });
        } else if (editType === 'portfolio') {
          const next = upsert(portfolio, editing); setPortfolio(next); persist({ portfolio: next });
        } else {
          const next = upsert(testimonials, editing); setTestimonials(next); persist({ testimonials: next });
        }
        setEditing(null);
      };
      const remove = (type, id) => {
        if (type === 'service') { const next = services.filter((x) => x.id !== id); setServices(next); persist({ services: next }); }
        else if (type === 'portfolio') { const next = portfolio.filter((x) => x.id !== id); setPortfolio(next); persist({ portfolio: next }); }
        else { const next = testimonials.filter((x) => x.id !== id); setTestimonials(next); persist({ testimonials: next }); }
      };

      const kpis = [
        { l: T.kTotal, v: leads.length, i: 'inbox' },
        { l: T.kNew, v: leads.filter((l) => l.status === 'new').length, i: 'star' },
        { l: T.kWon, v: leads.filter((l) => l.status === 'won').length, i: 'circle-check' },
        { l: T.kProjects, v: portfolio.length, i: 'folder-open' },
      ];

      // Pesquisa (filtra a lista do separador actual)
      const q = search.trim().toLowerCase();
      const inc = (s) => (s == null ? '' : String(s)).toLowerCase().includes(q);
      const fLeads = q ? leads.filter((l) => inc(l.nome) || inc(l.email) || inc(l.servico) || inc(l.mensagem) || inc(l.telefone)) : leads;
      const fServices = q ? services.filter((s) => inc(s.t) || inc(s.d) || inc(s.category) || inc(s.price)) : services;
      const fPortfolio = q ? portfolio.filter((p) => inc(p.t) || inc(p.c) || inc(p.tag) || inc(p.url)) : portfolio;
      const fTestimonials = q ? testimonials.filter((x) => inc(x.q) || inc(x.n) || inc(x.r)) : testimonials;

      // Notificações: leads novos + acção "notificar cliente"
      const newLeads = leads.filter((l) => (l.status || 'new') === 'new');
      const msgCliente = (l) => `Olá ${l.nome || ''}! Aqui é a Cari Tech Graphic. Recebemos o seu pedido${l.servico ? ' de ' + l.servico : ''} e vamos entrar em contacto em breve. Obrigado!`;
      const notifyClientWhats = (l) => window.open(`https://wa.me/${String(l.telefone || '').replace(/\D/g, '')}?text=${encodeURIComponent(msgCliente(l))}`, '_blank', 'noopener');
      const notifyClientMail = (l) => window.open(`mailto:${l.email}?subject=${encodeURIComponent('Cari Tech Graphic — recebemos o seu pedido')}&body=${encodeURIComponent(msgCliente(l))}`, '_blank');

      const NAV = [
        { grp: T.geral, items: [ ['overview','gauge-high'], ['leads','inbox'] ] },
        { grp: T.conteudo, items: [ ['services','layer-group'], ['portfolio','folder-open'], ['testimonials','quote-right'], ['contact','address-book'] ] },
        { grp: T.sistema, items: [ ['finance','wallet'], ['settings','gear'] ] },
      ];

      return (
        <div className="admin-shell">
          {sidebarOpen && <div className="side-overlay" onClick={() => setSidebarOpen(false)} />}
          <aside className={`admin-side ${sidebarOpen ? 'open' : ''}`}>
            <div className="admin-logo">
              <div className="admin-logo-mark">C</div>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>Cari Tech</div>
                <div style={{fontSize:10,opacity:0.6}}>Painel</div>
              </div>
              <button className="side-close" onClick={() => setSidebarOpen(false)} aria-label="Fechar menu"><FA name="xmark" s={16} /></button>
            </div>
            <a className="side-cta" href="index.html" target="_blank" rel="noreferrer"><FA name="up-right-from-square" s={13} />{T.viewsite}</a>
            {NAV.map((g, gi) => (
              <React.Fragment key={gi}>
                <div className="admin-nav-group">{g.grp}</div>
                {g.items.map(([id, ico]) => (
                  <button key={id} className={`admin-nav-item ${tab === id ? 'active' : ''}`} onClick={() => setTab(id)}><FA name={ico} s={15} />{T[id]}</button>
                ))}
              </React.Fragment>
            ))}
            <button className="admin-nav-item" onClick={logout}><FA name="arrow-right-from-bracket" s={15} />{T.logout}</button>
            <div className="admin-foot">
              Sessão activa · <b style={{color:'rgba(255,255,255,0.6)'}}>{APP_VERSION}</b><br/>
              <a href="index.html"><FA name="arrow-left" s={11} /> {T.viewsite}</a>
            </div>
          </aside>

          <main className="admin-main">
            <div className="admin-topbar">
              <button className="admin-hamburger" onClick={() => setSidebarOpen(true)} aria-label="Abrir menu"><FA name="bars" s={18} /></button>
              <div className="admin-topbar-title">
                <h1>{tab === 'overview' ? `${T.greeting} 👋` : T[tab] || ''}</h1>
                <p>{tab === 'overview' ? T.greetingSub : T.panelSub}</p>
              </div>
              <div className="admin-topbar-actions">
                <label className="admin-search">
                  <FA name="magnifying-glass" s={14} />
                  <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder={T.search} />
                  {search && <button type="button" className="admin-search-clear" onClick={() => setSearch('')} aria-label="Limpar"><FA name="xmark" s={12} /></button>}
                </label>
                <div className="notif-wrap">
                  <button className="admin-toggle notif-btn" onClick={() => setNotifOpen((o) => !o)} title={T.notifications} aria-label={T.notifications}>
                    <FA name="bell" s={15} />
                    {newLeads.length > 0 && <span className="notif-badge">{newLeads.length}</span>}
                  </button>
                  {notifOpen && (
                    <div className="notif-panel">
                      <div className="notif-head">{T.newRequests} ({newLeads.length})</div>
                      {newLeads.length === 0 ? (
                        <div className="notif-empty">{T.noNew}</div>
                      ) : newLeads.slice(0, 6).map((l) => (
                        <div className="notif-item" key={l.id}>
                          <div className="notif-av">{(l.nome || '?').charAt(0).toUpperCase()}</div>
                          <div className="notif-main">
                            <div className="notif-name">{l.nome}</div>
                            <div className="notif-sub">{l.servico || l.email}</div>
                          </div>
                          <div className="notif-actions">
                            {l.telefone && <button type="button" title={T.notifyClient} onClick={() => notifyClientWhats(l)}><i className="fa-brands fa-whatsapp" aria-hidden="true" /></button>}
                            <button type="button" title={T.notifyClient} onClick={() => notifyClientMail(l)}><FA name="paper-plane" s={13} /></button>
                          </div>
                        </div>
                      ))}
                      <button className="notif-all" onClick={() => { setTab('leads'); setNotifOpen(false); }}>{T.viewAllLeads}</button>
                    </div>
                  )}
                </div>
                <button className="admin-toggle" onClick={() => setLang(lang === 'pt' ? 'en' : 'pt')} title="Idioma"><FA name="globe" s={14} /> {lang.toUpperCase()}</button>
                <button className="admin-toggle" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')} aria-label="Tema" title="Tema">
                  <FA name={theme === 'light' ? 'moon' : 'sun'} s={15} />
                </button>
                <span className="ver-chip" title="Versão do painel"><FA name="code-branch" s={11} /> {APP_VERSION}</span>
              </div>
            </div>

            <div className="kpi-row">
              {kpis.map((k, i) => (
                <div className="kpi" key={i}>
                  <div className="kpi-ico"><FA name={k.i} s={17} /></div>
                  <div className="kpi-label">{k.l}</div>
                  <div className="kpi-num">{k.v}</div>
                </div>
              ))}
            </div>

            {tab === 'services' && (
              <>
              <HeadingEditor heading={headings.services} onCommit={(f, v) => updateHeading('services', f, v)} />
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>{T.svcTitle}</h2>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <SaveHint state={saveState} />
                    <button className="btn-add" onClick={() => openNew('service')}><Plus />{T.newSvc}</button>
                  </div>
                </div>
                <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>{T.svcNote}</p>
                <div style={{overflowX:'auto'}}>
                  <table className="admin-table">
                    <thead><tr><th>{T.thService}</th><th>{T.thCategory}</th><th>{T.thPrice}</th><th style={{textAlign:'center'}}>{T.thRequests}</th><th>{T.thState}</th><th></th></tr></thead>
                    <tbody>
                      {fServices.map((s) => {
                        const nPed = leads.filter((l) => (l.servico || '').trim().toLowerCase() === (s.t || '').trim().toLowerCase()).length;
                        return (
                        <tr key={s.id}>
                          <td>
                            <div style={{fontWeight:600}}>{s.t}</div>
                            <div style={{fontSize:12,color:'var(--ink-muted)',maxWidth:340}}>{s.d}</div>
                          </td>
                          <td><span className={`table-tag tag-${s.category}`}>{s.category}</span></td>
                          <td style={{whiteSpace:'nowrap'}}>{s.price}</td>
                          <td style={{textAlign:'center'}}><span className="table-tag" style={{background: nPed ? 'var(--accent)' : 'var(--bg-soft)', color: nPed ? '#fff' : 'var(--ink-muted)', fontWeight:700}}>{nPed}</span></td>
                          <td><span className={`table-tag tag-${s.status}`}>{s.status === 'active' ? T.stActiveT : T.stDraftT}</span></td>
                          <td><div className="row-actions">
                            <button className="ra-btn" onClick={() => openEdit('service', s)}><Pencil /></button>
                            <button className="ra-btn danger" onClick={() => remove('service', s.id)}><Trash /></button>
                          </div></td>
                        </tr>
                      );})}
                    </tbody>
                  </table>
                </div>
              </div>
              </>
            )}

            {tab === 'portfolio' && (
              <>
              <HeadingEditor heading={headings.portfolio} onCommit={(f, v) => updateHeading('portfolio', f, v)} />
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>{T.portTitle}</h2>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <SaveHint state={saveState} />
                    <button className="btn-add" onClick={() => openNew('portfolio')}><Plus />{T.newPort}</button>
                  </div>
                </div>
                <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>{T.portNote}</p>
                <div style={{overflowX:'auto'}}>
                  <table className="admin-table">
                    <thead><tr><th>{T.thProject}</th><th>{T.thDesc}</th><th>{T.thCategory}</th><th>{T.thYear}</th><th>{T.thState}</th><th></th></tr></thead>
                    <tbody>
                      {fPortfolio.map((p) => (
                        <tr key={p.id}>
                          <td style={{fontWeight:600}}>{p.t}</td>
                          <td style={{fontSize:12,color:'var(--ink-soft)',maxWidth:280}}>{p.c}</td>
                          <td><span className={`table-tag tag-${p.tag}`}>{p.tag}</span></td>
                          <td>{p.year}</td>
                          <td><span className={`table-tag tag-${p.status}`}>{p.status === 'active' ? T.stPub : T.stDraftT}</span></td>
                          <td><div className="row-actions">
                            <button className="ra-btn" onClick={() => openEdit('portfolio', p)}><Pencil /></button>
                            <button className="ra-btn danger" onClick={() => remove('portfolio', p.id)}><Trash /></button>
                          </div></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              </>
            )}

            {tab === 'testimonials' && (
              <>
              <HeadingEditor heading={headings.testimonials} onCommit={(f, v) => updateHeading('testimonials', f, v)} />
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>{T.testTitle}</h2>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <SaveHint state={saveState} />
                    <button className="btn-add" onClick={() => openNew('testimonial')}><Plus />{T.newTest}</button>
                  </div>
                </div>
                <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:16}}>{T.testNote}</p>
                <div style={{overflowX:'auto'}}>
                  <table className="admin-table">
                    <thead><tr><th>{T.thTestimonial}</th><th>{T.thClient}</th><th>{T.thRole}</th><th>{T.thState}</th><th></th></tr></thead>
                    <tbody>
                      {fTestimonials.map((it) => (
                        <tr key={it.id}>
                          <td style={{fontSize:12,color:'var(--ink-soft)',maxWidth:360}}>“{(it.q || '').length > 90 ? it.q.slice(0, 90) + '…' : it.q}”</td>
                          <td style={{fontWeight:600}}>{it.n}</td>
                          <td style={{fontSize:12,color:'var(--ink-muted)'}}>{it.r}</td>
                          <td><span className={`table-tag tag-${it.status}`}>{it.status === 'active' ? T.stActiveT : T.stDraftT}</span></td>
                          <td><div className="row-actions">
                            <button className="ra-btn" onClick={() => openEdit('testimonial', it)}><Pencil /></button>
                            <button className="ra-btn danger" onClick={() => remove('testimonial', it.id)}><Trash /></button>
                          </div></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              </>
            )}

            {tab === 'leads' && (
              <div className="admin-panel">
                <div className="admin-panel-head">
                  <h2>{T.leadsTitle}</h2>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    <button className="btn-add" onClick={downloadLeadsCSV} disabled={!leads.length}>
                      <FA name="file-arrow-down" s={13} />{T.downloadReport}
                    </button>
                    <button className="btn-add" onClick={loadLeads} style={{background:'var(--bg-soft)',color:'var(--ink)'}}>
                      <FA name="rotate" s={13} />{T.refresh}
                    </button>
                  </div>
                </div>
                {leadsLoading ? (
                  <p style={{color:'var(--ink-muted)',fontSize:14,padding:'20px 0'}}>{T.loadingReq}</p>
                ) : leads.length === 0 ? (
                  <div style={{textAlign:'center',padding:'48px 20px',color:'var(--ink-muted)'}}>
                    <FA name="inbox" s={40} style={{opacity:0.3}} />
                    <p style={{marginTop:14,fontSize:15,fontWeight:600}}>{T.noReqT}</p>
                    <p style={{fontSize:13}}>{T.noReqS}</p>
                  </div>
                ) : (
                  <div style={{overflowX:'auto'}}>
                    <table className="admin-table">
                      <thead><tr><th>{T.thName}</th><th>{T.thContact}</th><th>{T.thService}</th><th>{T.thMessage}</th><th>{T.thDate}</th><th>{T.thState}</th><th></th></tr></thead>
                      <tbody>
                        {fLeads.map((l) => (
                          <tr key={l.id}>
                            <td style={{fontWeight:600}}>{l.nome}</td>
                            <td style={{fontSize:12}}>
                              <div>{l.email}</div>
                              {l.telefone && <div style={{color:'var(--ink-muted)'}}>{l.telefone}</div>}
                            </td>
                            <td>{l.servico || '—'}</td>
                            <td style={{maxWidth:240,fontSize:12,color:'var(--ink-soft)'}} title={l.mensagem}>
                              {(l.mensagem || '').length > 70 ? l.mensagem.slice(0, 70) + '…' : l.mensagem}
                            </td>
                            <td style={{fontSize:12,whiteSpace:'nowrap'}}>{fmtData(l.data)}</td>
                            <td>
                              <select
                                value={l.status || 'new'}
                                onChange={(e) => setLeadStatus(l.id, e.target.value)}
                                style={{padding:'5px 8px',borderRadius:8,border:'1px solid var(--line)',fontSize:12,fontWeight:600,background:'var(--bg-soft)',color:'var(--ink)'}}
                              >
                                {[['new',T.sNew],['contacted',T.sContacted],['won',T.sWon],['lost',T.sLost]].map(([k,lab]) => <option key={k} value={k}>{lab}</option>)}
                              </select>
                            </td>
                            <td>
                              <div className="row-actions">
                                {(() => {
                                  const cs = (deliveries[l.id] && deliveries[l.id].comentarios) || [];
                                  const nCli = cs.filter((c) => c.de === 'cliente').length;
                                  if (!nCli) return null;
                                  return (
                                    <button className="ra-btn" title={T.dlvComments} onClick={() => openDeliver(l)}
                                      style={{color:'var(--accent)',position:'relative',fontWeight:700}}>
                                      <FA name="comment-dots" s={13} />
                                      <span style={{position:'absolute',top:-4,right:-4,background:'var(--accent)',color:'#fff',fontSize:9,fontWeight:700,borderRadius:999,minWidth:14,height:14,display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'0 3px'}}>{nCli}</span>
                                    </button>
                                  );
                                })()}
                                <button className="ra-btn" title={T.actDeliver} onClick={() => openDeliver(l)}
                                  style={deliveries[l.id] && deliveries[l.id].entregue ? {color:'var(--success,#30a46c)'} : {}}>
                                  <FA name={deliveries[l.id] && deliveries[l.id].entregue ? 'box-open' : 'box'} s={13} />
                                </button>
                                {l.telefone && (
                                  <a className="ra-btn" title="WhatsApp" target="_blank" rel="noreferrer"
                                     href={`https://wa.me/${(l.telefone||'').replace(/\D/g,'')}`}><i className="fa-brands fa-whatsapp" style={{fontSize:13,lineHeight:1}} aria-hidden="true" /></a>
                                )}
                                <a className="ra-btn" title={T.actReplyMail} href={`mailto:${l.email}?subject=${encodeURIComponent('Cari Tech Graphic — o seu pedido')}`}><FA name="reply" s={13} /></a>
                                <button className="ra-btn danger" title={T.actRemove} onClick={() => deleteLead(l.id)}><Trash /></button>
                              </div>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {tab === 'contact' && (
              <ContactEditor contact={contact} onCommit={updateContact} saveState={saveState} />
            )}

            {tab === 'finance' && <FinancasView />}

            {tab === 'overview' && (() => {
              const seg = [
                { k: 'new', label: T.sNew, c: 'var(--accent)', v: leads.filter((l) => (l.status || 'new') === 'new').length },
                { k: 'contacted', label: T.sContacted, c: '#A78BFA', v: leads.filter((l) => l.status === 'contacted').length },
                { k: 'won', label: T.sWon, c: 'var(--success)', v: leads.filter((l) => l.status === 'won').length },
                { k: 'lost', label: T.sLost, c: 'var(--ink-muted)', v: leads.filter((l) => l.status === 'lost').length },
              ];
              const total = leads.length;
              const denom = total || 1;
              let acc = 0; const stops = [];
              seg.forEach((s) => { const a = (acc / denom) * 360; acc += s.v; const b = (acc / denom) * 360; if (s.v > 0) stops.push(`${s.c} ${a}deg ${b}deg`); });
              const grad = total > 0 ? `conic-gradient(${stops.join(',')})` : 'conic-gradient(var(--line) 0deg)';
              const recent = leads.slice(0, 6);
              return (
                <>
                  <div className="dash-grid">
                    <div className="admin-panel">
                      <div className="admin-panel-head">
                        <h2>{T.recent}</h2>
                        <button className="btn-add" style={{background:'var(--bg-soft)',color:'var(--ink)'}} onClick={() => setTab('leads')}>{T.viewAll}</button>
                      </div>
                      {recent.length === 0 ? (
                        <div style={{textAlign:'center',padding:'32px 0',color:'var(--ink-muted)'}}>
                          <FA name="inbox" s={34} style={{opacity:0.3}} />
                          <p style={{marginTop:10,fontSize:14}}>{T.noRequests}</p>
                        </div>
                      ) : recent.map((l) => (
                        <div className="recent-lead" key={l.id}>
                          <div className="rl-av">{(l.nome || '?').charAt(0).toUpperCase()}</div>
                          <div className="rl-main">
                            <div className="rl-name">{l.nome}</div>
                            <div className="rl-sub">{l.servico || l.email}</div>
                          </div>
                          <div style={{textAlign:'right',flex:'0 0 auto'}}>
                            <span className={`table-tag tag-${l.status === 'won' ? 'active' : l.status === 'new' ? 'marketing' : 'design'}`}>{({new:T.sNew,contacted:T.sContacted,won:T.sWon,lost:T.sLost}[l.status]) || l.status}</span>
                            <div style={{fontSize:11,color:'var(--ink-muted)',marginTop:4}}>{fmtData(l.data)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="admin-panel">
                      <h2 style={{marginBottom:4}}>{T.byStatus}</h2>
                      <div className="donut-wrap">
                        <div className="donut" style={{background: grad}}>
                          <div className="donut-center">
                            <div style={{fontSize:28,fontWeight:700}}>{total}</div>
                            <div style={{fontSize:11,color:'var(--ink-muted)'}}>{T.leadsUnit}</div>
                          </div>
                        </div>
                        <div className="donut-legend">
                          {seg.map((s) => (
                            <div className="dl-item" key={s.k}><span className="dl-dot" style={{background:s.c}} />{s.label}<span className="dl-val">{s.v}</span></div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                  <div className="admin-panel">
                    <div className="admin-panel-head"><h2>{T.siteContent}</h2></div>
                    <div className="mini-stats">
                      <div className="mini-stat"><div className="n">{services.filter((s) => s.status === 'active').length}</div><div className="l">{T.stActive}</div></div>
                      <div className="mini-stat"><div className="n">{portfolio.filter((p) => p.status === 'active').length}</div><div className="l">{T.stPublished}</div></div>
                      <div className="mini-stat"><div className="n">{testimonials.filter((t) => t.status === 'active').length}</div><div className="l">{T.stTestim}</div></div>
                    </div>
                  </div>
                </>
              );
            })()}

            {tab === 'settings' && (
              <>
                <AccountEditor username={username} onChanged={setUsername} />
                <LogoManager branding={branding} onChange={setBranding} />
                <PaymentsEditor payments={payments} onSaved={setPayments} />
                <MozPaymentEditor mozpayment={mozpayment} onSaved={setMozpayment} />
                <SitesEditor sites={sites} onSaved={setSites} />
                <SocialEditor social={social} onSaved={setSocial} />
                <SmtpEditor smtp={smtp} onSaved={setSmtp} />
                <SegEditor seg={seg} onSaved={setSeg} />
                <HealthPanel />
                <SiteUpdater />
                <AuditPanel />
                <div className="admin-panel">
                  <h2 style={{marginBottom:12}}>{T.aboutTitle}</h2>
                  <p style={{color:'var(--ink-muted)',fontSize:13,lineHeight:1.6,marginBottom:12}}>{T.aboutP1}</p>
                  <p style={{color:'var(--ink-muted)',fontSize:13,lineHeight:1.6}}>{T.aboutP2}</p>
                </div>
              </>
            )}
          </main>

          {editing && (
            <div className="form-modal show" onClick={() => setEditing(null)}>
              <div className="form-shell" onClick={(e) => e.stopPropagation()}>
                <button className="form-close" onClick={() => setEditing(null)}><FA name="xmark" s={14} /></button>
                <h3>{editType === 'service' ? T.mSvc : editType === 'portfolio' ? T.mPort : T.mTest}</h3>
                <div style={{display:'grid',gap:12}}>
                  {editType === 'service' ? (
                    <>
                      <div className="field"><label>{T.fSvcName}</label><input value={editing.t} onChange={(e) => setEditing({...editing, t: e.target.value})} placeholder={T.phSvcName} /><div className="field-error"/></div>
                      <div className="field"><label>{T.fDescSite}</label><textarea rows="3" value={editing.d} onChange={(e) => setEditing({...editing, d: e.target.value})} placeholder={T.phSvcDesc} /><div className="field-error"/></div>
                      <ImageUploadField label={T.fImgOpt} hint={T.hintSvcImg} value={editing.img} onChange={(v) => setEditing({...editing, img: v})} />
                      <div className="field"><label>{T.fCategory}</label>
                        <select value={editing.category} onChange={(e) => setEditing({...editing, category: e.target.value})}>
                          <option value="design">Design</option><option value="web">Web</option><option value="marketing">Marketing</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                      <div className="field"><label>{T.fPriceRef}</label><input value={editing.price} onChange={(e) => setEditing({...editing, price: e.target.value})} placeholder={T.phPrice} /><div className="field-error"/></div>
                      <div className="field"><label>{T.fStatus}</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">{T.optActiveSite}</option><option value="draft">{T.optDraftHidden}</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  ) : editType === 'portfolio' ? (
                    <>
                      <div className="field"><label>{T.fPortTitle}</label><input value={editing.t} onChange={(e) => setEditing({...editing, t: e.target.value})} placeholder={T.phPortTitle} /><div className="field-error"/></div>
                      <div className="field"><label>{T.fDescSite}</label><input value={editing.c} onChange={(e) => setEditing({...editing, c: e.target.value})} placeholder={T.phPortDesc} /><div className="field-error"/></div>
                      <ImageUploadField label={T.fPortImg} hint={T.hintPortImg} value={editing.img} onChange={(v) => setEditing({...editing, img: v})} />
                      <div className="field"><label>{T.fSiteLink}</label><input value={editing.url || ''} onChange={(e) => setEditing({...editing, url: e.target.value})} placeholder="https://exemplo.com" /><div style={{fontSize:11,color:'var(--ink-muted)',marginTop:4}}>{T.hintSiteLink}</div><div className="field-error"/></div>
                      <div className="field"><label>{T.fCategory}</label>
                        <select value={editing.tag} onChange={(e) => setEditing({...editing, tag: e.target.value})}>
                          <option value="web">Web</option><option value="design">Design</option><option value="marketing">Marketing</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                      <div className="field"><label>{T.fYear}</label><input type="number" value={editing.year} onChange={(e) => setEditing({...editing, year: +e.target.value})} /><div className="field-error"/></div>
                      <div className="field"><label>{T.fStatus}</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">{T.optPublishedSite}</option><option value="draft">{T.optDraftHidden}</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="field"><label>{T.fTestimonial}</label><textarea rows="4" value={editing.q} onChange={(e) => setEditing({...editing, q: e.target.value})} placeholder={T.phTestimonial} /><div className="field-error"/></div>
                      <div className="field"><label>{T.fClientName}</label><input value={editing.n} onChange={(e) => setEditing({...editing, n: e.target.value})} placeholder={T.phClientName} /><div className="field-error"/></div>
                      <div className="field"><label>{T.fRoleCompany}</label><input value={editing.r} onChange={(e) => setEditing({...editing, r: e.target.value})} placeholder={T.phRoleCompany} /><div className="field-error"/></div>
                      <ImageUploadField label={T.fClientPhoto} hint={T.hintClientPhoto} value={editing.img} onChange={(v) => setEditing({...editing, img: v})} />
                      <div className="field"><label>{T.fStatus}</label>
                        <select value={editing.status} onChange={(e) => setEditing({...editing, status: e.target.value})}>
                          <option value="active">{T.optActiveSite}</option><option value="draft">{T.optDraftHidden}</option>
                        </select>
                        <div className="field-error"/>
                      </div>
                    </>
                  )}
                  <div style={{display:'flex',gap:8,marginTop:8}}>
                    <button className="btn btn-accent" onClick={save}>{T.btnSave}</button>
                    <button className="btn btn-ghost" onClick={() => setEditing(null)}>{T.btnCancel}</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {delivering && (
            <div className="form-modal show" onClick={() => setDelivering(null)}>
              <div className="form-shell" onClick={(e) => e.stopPropagation()} style={{maxWidth:560}}>
                <button className="form-close" onClick={() => setDelivering(null)}><FA name="xmark" s={14} /></button>
                <h3>{T.dlvTitle}</h3>
                <div style={{fontSize:13,color:'var(--ink-muted)',marginBottom:14}}>
                  {T.dlvFor}: <strong style={{color:'var(--ink)'}}>{delivering.nome}</strong> · {delivering.email}
                </div>

                <div style={{background:'var(--bg-soft)',border:'1px solid var(--line)',borderRadius:10,padding:'10px 14px',marginBottom:16,fontSize:13}}>
                  <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--ink-muted)',marginBottom:4}}>{T.dlvCode}</div>
                  <div style={{fontFamily:'monospace',fontSize:18,fontWeight:700,letterSpacing:'0.15em',color:'var(--accent-2, var(--accent))'}}>{delivering.codigo || '—'}</div>
                  <div style={{fontSize:12,color:'var(--ink-muted)',marginTop:4}}>{T.dlvCodeHint}</div>
                </div>

                <div style={{marginBottom:16}}>
                  <label style={{marginBottom:8,display:'block'}}><FA name="money-bill-wave" s={13} /> {T.dlvPay}</label>
                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                    {[['nao','lock','#c0392b'],['parcial','clock','#b9770e'],['pago','circle-check','#166c46']].map(([est,ic,cor]) => (
                      <button key={est} type="button" onClick={() => dSetPago(est)}
                        style={{flex:'1 1 90px',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:7,padding:'9px 10px',borderRadius:9,fontSize:13,fontWeight:700,cursor:'pointer',
                          border: dPago===est ? `1.5px solid ${cor}` : '1px solid var(--line)',
                          background: dPago===est ? cor : 'var(--card,#fff)', color: dPago===est ? '#fff' : 'var(--ink)'}}>
                        <FA name={ic} s={12} /> {est==='nao'?T.payNao:(est==='parcial'?T.payParcial:T.payPago)}
                      </button>
                    ))}
                  </div>
                  <div style={{fontSize:11.5,color:'var(--ink-muted)',marginTop:6,lineHeight:1.45}}>{T.dlvPayHint}</div>
                </div>

                <div style={{display:'grid',gap:12}}>
                  <div className="field">
                    <label>{T.dlvMsg}</label>
                    <textarea rows="2" value={dForm.msg} onChange={(e) => setDForm({...dForm, msg: e.target.value})} placeholder={T.phDlvMsg} />
                    <div className="field-error"/>
                  </div>

                  <div>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                      <label style={{margin:0}}>{T.dlvFiles}</label>
                      <div style={{display:'flex',gap:8}}>
                        <label className="btn btn-ghost" style={{cursor:'pointer',margin:0}}>
                          <FA name="upload" s={12} /> {dBusy ? T.dlvUploading : T.dlvAddFile}
                          <input type="file" style={{display:'none'}} disabled={dBusy} onChange={(e) => { dUploadFile(e.target.files[0]); e.target.value=''; }} />
                        </label>
                        <button type="button" className="btn btn-ghost" onClick={dAddLink}><FA name="link" s={12} /> {T.dlvAddLink}</button>
                      </div>
                    </div>

                    {dForm.entregas.length === 0 ? (
                      <div style={{border:'1px dashed var(--line)',borderRadius:10,padding:'18px',textAlign:'center',color:'var(--ink-muted)',fontSize:13}}>{T.dlvNoItems}</div>
                    ) : (
                      <div style={{display:'grid',gap:10}}>
                        {dForm.entregas.map((it, i) => (
                          <div key={i} style={{border:'1px solid var(--line)',borderRadius:10,padding:'10px 12px',display:'grid',gap:8}}>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                              <span className={`table-tag ${it.tipo === 'file' ? 'tag-active' : 'tag-marketing'}`}>
                                <FA name={it.tipo === 'file' ? 'file' : 'link'} s={10} /> {it.tipo === 'file' ? T.dlvFile : T.dlvLink}
                              </span>
                              <input value={it.nome} onChange={(e) => dUpdateItem(i, 'nome', e.target.value)} placeholder={T.dlvItemName}
                                style={{flex:1,minWidth:0,padding:'6px 10px',border:'1px solid var(--line)',borderRadius:8,fontSize:13,background:'var(--card,#fff)',color:'var(--ink)'}} />
                              <button type="button" className="ra-btn danger" onClick={() => dRemoveItem(i)} title={T.btnRemove}><Trash s={12} /></button>
                            </div>
                            {it.tipo === 'link' && (
                              <input value={it.url} onChange={(e) => dUpdateItem(i, 'url', e.target.value)} placeholder={T.dlvLinkUrl}
                                style={{padding:'6px 10px',border:'1px solid var(--line)',borderRadius:8,fontSize:13,background:'var(--card,#fff)',color:'var(--ink)'}} />
                            )}
                            {it.tipo === 'file' && (
                              <div style={{fontSize:12,color:'var(--ink-muted)',wordBreak:'break-all'}}><FA name="paperclip" s={11} /> {it.url}</div>
                            )}
                            <input value={it.note} onChange={(e) => dUpdateItem(i, 'note', e.target.value)} placeholder={T.dlvItemNote}
                              style={{padding:'6px 10px',border:'1px solid var(--line)',borderRadius:8,fontSize:13,background:'var(--card,#fff)',color:'var(--ink)'}} />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {(() => {
                    const cf = (deliveries[delivering.id] && deliveries[delivering.id].cliente_ficheiros) || [];
                    return (
                      <div style={{borderTop:'1px solid var(--line)',paddingTop:14}}>
                        <label style={{marginBottom:8,display:'block'}}><FA name="paperclip" s={13} /> {T.dlvClientFiles} {cf.length ? `(${cf.length})` : ''}</label>
                        {cf.length === 0 ? (
                          <div style={{fontSize:13,color:'var(--ink-muted)'}}>{T.dlvNoClientFiles}</div>
                        ) : (
                          <div style={{display:'grid',gap:7}}>
                            {cf.map((f, i) => (
                              <a key={i} href={f.url} target="_blank" rel="noopener" download
                                style={{display:'flex',alignItems:'center',gap:9,padding:'8px 11px',border:'1px solid var(--line)',borderRadius:9,fontSize:13,color:'var(--ink)'}}>
                                <FA name="file-arrow-down" s={13} />
                                <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.nome || f.url}</span>
                                <span style={{fontSize:11,color:'var(--ink-muted)'}}>{fmtData(f.data)}</span>
                              </a>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {dSaved && (
                    <div style={{background:'#e9f8f0',border:'1px solid #b6e6cf',borderRadius:10,padding:'10px 14px',fontSize:13,color:'#166c46',fontWeight:600}}>
                      <FA name="circle-check" s={13} /> {T.dlvSaved}
                    </div>
                  )}

                  {(() => {
                    const coments = (deliveries[delivering.id] && deliveries[delivering.id].comentarios) || [];
                    return (
                      <div style={{borderTop:'1px solid var(--line)',paddingTop:14}}>
                        <label style={{marginBottom:8,display:'block'}}><FA name="comments" s={13} /> {T.dlvComments} {coments.length ? `(${coments.length})` : ''}</label>
                        {coments.length === 0 ? (
                          <div style={{fontSize:13,color:'var(--ink-muted)',marginBottom:10}}>{T.dlvNoComments}</div>
                        ) : (
                          <div style={{display:'grid',gap:8,marginBottom:10,maxHeight:200,overflowY:'auto'}}>
                            {coments.map((c, i) => {
                              const studio = c.de === 'studio' || c.de === 'admin';
                              return (
                                <div key={i} style={{display:'flex',gap:8,flexDirection: studio ? 'row-reverse' : 'row'}}>
                                  <div style={{background: studio ? 'var(--brand-mid,#036C6F)' : 'var(--accent)',color:'#fff',borderRadius:10,padding:'8px 11px',fontSize:13,maxWidth:'82%',lineHeight:1.45}}>
                                    {c.texto}
                                    <div style={{fontSize:10.5,opacity:0.75,marginTop:3}}>{studio ? 'Cari Tech' : (c.nome || 'Cliente')} · {fmtData(c.data)}</div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                        <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                          <textarea rows="1" value={dReply} onChange={(e) => setDReply(e.target.value)} placeholder={T.dlvReplyPh}
                            style={{flex:1,minHeight:40,resize:'vertical',padding:'9px 11px',border:'1px solid var(--line)',borderRadius:10,fontSize:13,fontFamily:'inherit',background:'var(--card,#fff)',color:'var(--ink)'}} />
                          <button type="button" className="btn btn-accent" onClick={dSendReply} disabled={dBusy || !dReply.trim()}><FA name="paper-plane" s={13} /></button>
                        </div>
                      </div>
                    );
                  })()}

                  <div style={{display:'flex',gap:8,marginTop:4,flexWrap:'wrap'}}>
                    <button className="btn btn-accent" onClick={dSave} disabled={dBusy}>{dBusy ? T.saving : T.dlvSave}</button>
                    {delivering.telefone && <button className="btn btn-ghost" onClick={() => dNotifyWhats(delivering)}><i className="fa-brands fa-whatsapp" aria-hidden="true" /> {T.dlvNotify}</button>}
                    <button className="btn btn-ghost" onClick={() => dNotifyMail(delivering)}><FA name="paper-plane" s={12} /> {T.dlvNotify}</button>
                    <a className="btn btn-ghost" href="cliente.html" target="_blank" rel="noopener" style={{marginLeft:'auto'}}><FA name="up-right-from-square" s={12} /> {T.dlvOpenClient}</a>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
