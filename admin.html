<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Cari Tech Graphic</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B4E50" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=118" />
  <link rel="icon" href="assets/icons/icon-192.png?v=118" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/styles.css?v=118" />
  <link rel="stylesheet" href="assets/css/styles-sections.css?v=118" />
  <link rel="stylesheet" href="assets/css/styles-modals.css?v=118" />
  <style>
    body { background: var(--bg-soft); font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .admin-shell {
      min-height: 100vh;
    }
    .admin-side {
      background: var(--brand-deep);
      color: #fff;
      padding: 22px 14px;
      display: flex; flex-direction: column; gap: 3px;
      position: fixed; top: 0; left: 0; bottom: 0; width: 256px; z-index: 40;
      overflow-y: auto;
    }
    .admin-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px 20px;
      margin-bottom: 8px;
    }
    .admin-logo-mark {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 11px;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff;
    }
    .side-cta {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 0 6px 12px; padding: 12px;
      border-radius: 12px; border: none; cursor: pointer;
      background: var(--accent); color: #fff;
      font-weight: 700; font-size: 13px; text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .side-cta:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .admin-nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px; font-weight: 500;
      color: rgba(255,255,255,0.68);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      border: none;
      background: transparent;
      text-align: left;
    }
    .admin-nav-item i { width: 18px; text-align: center; opacity: 0.9; }
    .admin-nav-item:hover {
      color: #fff; background: rgba(255,255,255,0.06);
    }
    .admin-nav-item.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px var(--accent-glow);
    }
    .admin-nav-item.active i { opacity: 1; }
    .admin-nav-item.active:hover { background: var(--accent); }
    .admin-foot {
      margin-top: auto;
      padding: 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
    .admin-foot a { color: var(--accent); }
    .admin-nav-group {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      padding: 14px 14px 6px;
    }

    .login-form { padding: 48px 44px; }

    .admin-main {
      padding: 24px 32px 80px;
      margin-left: 256px;
    }
    .admin-topbar {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 24px;
    }
    .admin-topbar-title { min-width: 0; }
    .admin-topbar h1 {
      font-size: 28px; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .admin-topbar p { font-size: 13px; color: var(--ink-muted); margin: 4px 0 0; }
    .admin-topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    /* Pesquisa + alternadores no topo do painel */
    .admin-search {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-elev); border: 1px solid var(--line);
      border-radius: 999px; padding: 8px 14px; color: var(--ink-muted);
      min-width: 200px;
    }
    .admin-search input { border: none; outline: none; background: none; font-size: 13px; color: var(--ink); width: 100%; }
    .admin-search-clear { border: none; background: none; color: var(--ink-muted); cursor: pointer; padding: 0; display: inline-flex; }
    .admin-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg-elev); border: 1px solid var(--line);
      border-radius: 999px; padding: 8px 12px; cursor: pointer;
      font-size: 12px; font-weight: 700; color: var(--ink-soft);
      height: 38px;
    }
    .admin-toggle:hover { color: var(--ink); border-color: var(--accent); }

    /* Notificações */
    .notif-wrap { position: relative; }
    .notif-btn { position: relative; }
    .notif-badge {
      position: absolute; top: -6px; right: -6px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: var(--danger, #ef4444); color: #fff;
      font-size: 11px; font-weight: 800; line-height: 18px; text-align: center;
      border: 2px solid var(--bg-elev);
    }
    .notif-panel {
      position: absolute; top: 46px; right: 0; z-index: 70;
      width: 320px; max-width: 86vw;
      background: var(--bg-elev); border: 1px solid var(--line);
      border-radius: 16px; box-shadow: 0 20px 50px rgba(2,31,33,0.18);
      overflow: hidden;
    }
    .notif-head { padding: 14px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--line); }
    .notif-empty { padding: 22px 16px; color: var(--ink-muted); font-size: 13px; text-align: center; }
    .notif-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .notif-av { width: 34px; height: 34px; border-radius: 10px; background: var(--brand-mid); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: 0 0 auto; }
    .notif-main { flex: 1; min-width: 0; }
    .notif-name { font-weight: 600; font-size: 13px; }
    .notif-sub { font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notif-actions { display: flex; gap: 6px; }
    .notif-actions button {
      width: 30px; height: 30px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--bg-soft); color: var(--ink-soft);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .notif-actions button:hover { background: var(--accent); color: #fff; }
    .notif-all { width: 100%; padding: 12px; border: none; background: var(--bg-soft); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; }
    .notif-all:hover { background: var(--accent); color: #fff; }

    /* Menu lateral: hambúrguer + overlay + botão fechar (mobile) */
    .admin-hamburger {
      display: none; border: 1px solid var(--line); background: var(--bg-elev);
      color: var(--ink); border-radius: 10px; width: 40px; height: 40px;
      align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto;
    }
    .side-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 55; }
    .side-close { display: none; margin-left: auto; background: none; border: none; color: rgba(255,255,255,0.7); cursor: pointer; }

    .kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 24px;
    }
    .kpi {
      background: var(--bg-elev);
      border-radius: 20px; padding: 20px 22px;
      border: 1px solid var(--line);
      box-shadow: 0 6px 20px rgba(2,31,33,0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .kpi:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(2,31,33,0.08); }
    .kpi-ico {
      width: 40px; height: 40px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,114,0,0.12); color: var(--accent);
      margin-bottom: 14px;
    }
    .kpi-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-muted);
    }
    .kpi-num {
      font-size: 30px; font-weight: 700;
      letter-spacing: -0.02em; margin-top: 4px;
    }
    .ver-chip {
      align-self: flex-start;
      background: var(--bg-elev); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 12px;
      font-size: 12px; font-weight: 600; color: var(--ink-soft);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .admin-topbar h1 { font-weight: 700; }

    /* ---- Dashboard (Visão geral) ---- */
    .dash-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
    .recent-lead { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .recent-lead:first-child { border-top: none; }
    .rl-av {
      width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; background: var(--brand-mid);
    }
    .rl-main { flex: 1; min-width: 0; }
    .rl-name { font-weight: 600; font-size: 14px; }
    .rl-sub { font-size: 12px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 6px 0; }
    .donut { width: 168px; height: 168px; border-radius: 50%; position: relative; }
    .donut::after {
      content: ''; position: absolute; inset: 22px; border-radius: 50%;
      background: var(--bg-elev);
    }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
    .donut-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; width: 100%; }
    .dl-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
    .dl-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
    .dl-val { margin-left: auto; font-weight: 700; }
    .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .mini-stat { background: var(--bg-soft); border-radius: 14px; padding: 16px; }
    .mini-stat .n { font-size: 24px; font-weight: 700; }
    .mini-stat .l { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

    .admin-panel {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(2,31,33,0.04);
    }
    .admin-panel-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .admin-panel-head h2 { font-size: 20px; letter-spacing: -0.01em; }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table th, .admin-table td {
      padding: 14px 12px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }
    .admin-table th {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: var(--bg-soft);
    }
    .admin-table tbody tr:hover { background: var(--bg-soft); }
    .table-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }
    .tag-web { background: #3B82F6; }
    .tag-design { background: #A78BFA; }
    .tag-marketing { background: var(--accent); }
    .tag-active { background: var(--success); }
    .tag-draft { background: var(--ink-muted); }

    .row-actions {
      display: flex; gap: 6px;
    }
    .ra-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--ink-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
      border: none;
    }
    .ra-btn:hover { background: var(--accent); color: #fff; }
    .ra-btn.danger:hover { background: var(--danger); }

    .admin-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-soft);
      padding: 4px;
      border-radius: 999px;
      margin-bottom: 24px;
      width: fit-content;
    }
    .admin-tab {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
    }
    .admin-tab.active {
      background: var(--bg-elev);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-add:hover { transform: translateY(-1px); }

    .form-modal {
      position: fixed; inset: 0;
      background: rgba(2, 31, 33, 0.55);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
      z-index: 200;
    }
    .form-modal.show { display: flex; }
    .form-shell {
      background: var(--bg-elev);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto;
      position: relative;
    }
    .form-shell h3 { font-size: 22px; margin-bottom: 20px; }
    .form-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }

    /* ---- Login responsivo ---- */
    @media (max-width: 860px) {
      .login-card { grid-template-columns: 1fr !important; min-height: 0 !important; max-width: 440px !important; }
      .login-hero { display: none !important; }
      .login-form { padding: 36px 26px !important; }
    }

    /* ---- Painel responsivo: menu lateral vira gaveta (drawer) ---- */
    @media (max-width: 1024px) {
      .admin-side {
        width: 264px; z-index: 60;
        transform: translateX(-100%); transition: transform 0.28s ease;
      }
      .admin-side.open { transform: translateX(0); box-shadow: 0 0 60px rgba(0,0,0,0.5); }
      .side-close { display: inline-flex; }
      .admin-hamburger { display: inline-flex; }
      .dash-grid { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .admin-main { padding: 16px; margin-left: 0; }
      .admin-topbar h1 { font-size: 20px; }
      .admin-search { min-width: 0; width: 140px; }
    }
    @media (max-width: 620px) {
      .admin-topbar { flex-wrap: wrap; }
      .admin-topbar-actions { width: 100%; order: 3; margin-left: 0; }
      .admin-search { flex: 1; }
      .ver-chip { display: none; }
    }
    @media (max-width: 520px) {
      .kpi-row { grid-template-columns: 1fr 1fr; }
      .kpi-num { font-size: 26px; }
      .mini-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ---- API do painel (admin-api.php) ----
    // Token CSRF da sessão — preenchido no arranque (?action=session) e enviado
    // em todos os pedidos que alteram estado (defesa contra pedidos forjados).
    let CSRF = '';

    const api = async (action, method = 'GET', body = null) => {
      const opts = { method, headers: { 'Accept': 'application/json', 'X-CSRF-Token': CSRF }, credentials: 'same-origin' };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch(`admin-api.php?action=${action}`, opts);
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (data && data.csrf) CSRF = data.csrf;
      return { status: res.status, ...data };
    };

    // Versão do painel/site — mostrada APENAS no painel (nunca no site público).
    const APP_VERSION = '1.10.0';

    // Upload de ficheiros (logótipo, ZIP) — multipart.
    const apiUpload = async (action, formData) => {
      const res = await fetch(`admin-api.php?action=${action}`, {
        method: 'POST', body: formData, credentials: 'same-origin',
        headers: { 'Accept': 'application/json', 'X-CSRF-Token': CSRF },
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (data && data.csrf) CSRF = data.csrf;
      return { status: res.status, ...data };
    };

    const LEAD_STATUS = {
      new:       { label: 'Novo',       cls: 'tag-marketing' },
      contacted: { label: 'Contactado', cls: 'tag-design' },
      won:       { label: 'Ganho',      cls: 'tag-active' },
      lost:      { label: 'Perdido',    cls: 'tag-draft' },
    };

    const fmtData = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const p = (n) => String(n).padStart(2, '0');
      return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };

    function FA({ name, s = 14, style = {} }) { return <i className={`fa-solid fa-${name}`} style={{fontSize:s,lineHeight:1,...style}} aria-hidden="true" />; }

    // ---- Ecrã de login (layout split-screen, cores do sistema) ----
    function LoginField({ icon, label, value, onChange, type = 'text', placeholder, trailing, autoFocus }) {
      return (
        <div style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.12)',borderRadius:14,padding:'9px 14px',display:'flex',alignItems:'center',gap:12}}>
          <FA name={icon} s={15} style={{color:'rgba(255,255,255,0.4)'}} />
          <div style={{flex:1,minWidth:0}}>
            <label style={{display:'block',fontSize:10,letterSpacing:'0.09em',textTransform:'uppercase',color:'rgba(255,255,255,0.45)',marginBottom:1}}>{label}</label>
            <input
              value={value} onChange={(e) => onChange(e.target.value)} type={type} placeholder={placeholder} autoFocus={autoFocus}
              style={{width:'100%',background:'none',border:'none',outline:'none',color:'#fff',fontSize:14,padding:0}}
            />
          </div>
          {trailing}
        </div>
      );
    }

    function Login({ onOk }) {
      const [user, setUser] = useState('admin');
      const [pass, setPass] = useState('');
      const [show, setShow] = useState(false);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      const submit = async (e) => {
        e.preventDefault();
        setBusy(true); setErr('');
        const r = await api('login', 'POST', { username: user.trim(), password: pass });
        setBusy(false);
        if (r.ok) onOk();
        else setErr(r.message || AT('loginErr'));
      };
      return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,background:'var(--brand-deep)'}}>
          <div className="login-card" style={{display:'grid',gridTemplateColumns:'1fr 1fr',width:'100%',maxWidth:900,minHeight:520,background:'#0e1416',borderRadius:24,overflow:'hidden',boxShadow:'0 30px 80px rgba(0,0,0,0.5)',border:'1px solid rgba(255,255,255,0.06)'}}>
            <div className="login-hero" style={{position:'relative',padding:'44px 40px',display:'flex',flexDirection:'column',justifyContent:'space-between',background:'linear-gradient(160deg, var(--brand-mid), var(--brand-deep))'}}>
              <div style={{position:'absolute',width:280,height:280,borderRadius:'50%',background:'var(--accent)',opacity:0.18,filter:'blur(70px)',top:-60,right:-60}} />
              <div style={{position:'relative',display:'flex',alignItems:'center',gap:10,color:'#fff',fontWeight:800,fontSize:20}}>
                <span style={{width:34,height:34,borderRadius:10,background:'var(--accent)',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:16}}>C</span>
                Cari Tech
              </div>
              <div style={{position:'relative'}}>
                <div style={{color:'var(--accent)',fontWeight:700,letterSpacing:'0.14em',fontSize:11,textTransform:'uppercase',marginBottom:12}}>{AT('loginPanelTag')}</div>
                <h2 style={{color:'#fff',fontSize:34,lineHeight:1.14,fontWeight:800,margin:0}}>{AT('loginWelcome1')}<br/><span style={{color:'var(--accent)'}}>{AT('loginWelcome2')}</span>.</h2>

    function ImageUploadField({ label, hint, value, onChange }) {
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState('');
      const ref = React.useRef(null);
      const up = async (f) => {
        if (!f) return;
        setBusy(true); setErr('');
        const fd = new FormData(); fd.append('image', f);
        const r = await apiUpload('upload-image', fd);
        setBusy(false);
        if (r.ok) onChange(r.url); else setErr(r.message || AT('upError'));
      };
      return (
        <div className="field">
          <label>{label}</label>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            {value
              ? <img src={value} alt="" style={{height:48,width:48,objectFit:'cover',borderRadius:10,border:'1px solid var(--line)'}} />
              : <div style={{height:48,width:48,borderRadius:10,background:'var(--bg-soft)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-muted)'}}><FA name="image" s={16} /></div>}
            <input ref={ref} type="file" accept="image/*" style={{display:'none'}} onChange={(e) => up(e.target.files[0])} />
            <button type="button" className="btn btn-ghost" onClick={() => ref.current && ref.current.click()} disabled={busy}>
              {busy ? AT('upSending') : (value ? AT('upChange') : AT('upLoad'))}
            </button>
            {value && <button type="button" className="btn btn-ghost" onClick={() => onChange('')}>{AT('btnRemove')}</button>}
          </div>
          {hint && <div style={{fontSize:11,color:'var(--ink-muted)',marginTop:4}}>{hint}</div>}
          <div className="field-error">{err}</div>
        </div>
      );
    }

        if (r.ok) onChanged(r.branding || {}); else setMsg({ ok: false, text: r.message || 'Erro.' });

    function SiteUpdater() {
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const [file, setFile] = useState(null);
      const [log, setLog] = useState(null);
      const [backups, setBackups] = useState([]);
      const loadLog = () => api('update-log').then((r) => { if (r.ok) { setLog(r.log || []); setBackups(r.backups || []); } else { setLog([]); setBackups([]); } });
      useEffect(() => { loadLog(); }, []);
      const submit = async () => {
        if (!file) return;
        if (!window.confirm(AT('updConfirm'))) return;
        setBusy(true); setMsg(null);
        const fd = new FormData(); fd.append('zip', file);
        const r = await apiUpload('update-zip', fd);
        setBusy(false);
        setMsg(r.ok ? { ok: true, text: r.message } : { ok: false, text: r.message || AT('updError') });
        if (r.ok) { setFile(null); loadLog(); }
      };
      const restore = async (backup) => {
        if (!window.confirm(AT('updRestoreConfirm'))) return;
        setBusy(true); setMsg(null);
        const r = await api('update-restore', 'POST', { backup });
        setBusy(false);
        setMsg(r.ok ? { ok: true, text: r.message } : { ok: false, text: r.message || AT('updError') });
        if (r.ok) loadLog();
      };
      return (
        <div className="admin-panel" style={{marginBottom:16}}>
          <h2 style={{marginBottom:6}}>{AT('updTitle')}</h2>
          <p style={{color:'var(--ink-muted)',fontSize:13,marginBottom:14}}>
            {AT('updNote')}
          </p>
          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
            <input type="file" accept=".zip,application/zip" onChange={(e) => setFile(e.target.files[0] || null)} />
            <button type="button" className="btn btn-accent" onClick={submit} disabled={busy || !file}>
              <FA name="upload" s={13} /> {busy ? AT('updating') : AT('btnUpdateSite')}
            </button>
          </div>
          <Aviso msg={msg} />
          <div style={{marginTop:12,background:'#fff8e6',border:'1px solid #ffe08a',borderRadius:10,padding:'10px 14px',fontSize:12.5,color:'#7a5b00'}}>
            {AT('updTip')}
          </div>
          <div style={{marginTop:16,borderTop:'1px solid var(--line)',paddingTop:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <h3 style={{margin:0,fontSize:14,display:'flex',alignItems:'center',gap:8}}><FA name="clock-rotate-left" s={13} /> {AT('updLogTitle')}</h3>
              {log && log.length > 0 && <span style={{fontSize:12,color:'var(--ink-muted)'}}>{log.length}</span>}
            </div>
            {log === null ? (
              <p style={{color:'var(--ink-muted)',fontSize:13}}>{AT('loading')}</p>
            ) : log.length === 0 ? (
              <div style={{border:'1px dashed var(--line)',borderRadius:10,padding:'16px',textAlign:'center',color:'var(--ink-muted)',fontSize:13}}>{AT('updLogEmpty')}</div>
            ) : (
              <div style={{display:'grid',gap:8}}>
                {log.map((e, i) => (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:11,padding:'9px 12px',border:'1px solid var(--line)',borderRadius:10,fontSize:13}}>
                    <span style={{width:32,height:32,flex:'none',borderRadius:8,display:'grid',placeItems:'center',background:'var(--bg-soft)',color:'var(--accent)'}}><FA name="box-open" s={13} /></span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{e.ficheiro || 'ZIP'}</div>
                      <div style={{fontSize:11.5,color:'var(--ink-muted)'}}>{fmtData(e.data)}</div>
                    </div>
                    <span style={{fontSize:12,fontWeight:700,color:'var(--success)',whiteSpace:'nowrap'}}>{(e.count || 0)} {AT('updLogFiles')}</span>
                    {e.backup && backups.includes(e.backup) && (
                      <button type="button" className="btn btn-ghost" style={{padding:'5px 10px',fontSize:12}} disabled={busy} onClick={() => restore(e.backup)} title={AT('updRestoreHint')}>
                        <FA name="rotate-left" s={11} /> {AT('updRestore')}
                      </button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

      const noPeriodo = (m) => {

        if (periodo === 'custom') { if (de && d < de) return false; if (ate && d > ate) return false; return true; }
        if (periodo === 'all') return true;
        if (!/^\d{4}-\d{2}/.test(d)) return false;
        const hoje = new Date();
        if (periodo === 'mes') return d.slice(0, 7) === hoje.toISOString().slice(0, 7);
        if (periodo === 'ano') return d.slice(0, 4) === String(hoje.getFullYear());
        if (periodo === '3meses') { const lim = new Date(hoje); lim.setMonth(lim.getMonth() - 3); return new Date(d) >= lim; }
        return true;
      };
      let L = (list || []).filter(noPeriodo);
      if (limite > 0) L = [...L].sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, limite);
      const totalRaw = (list || []).length;
      const totais = L.reduce((a, m) => {
        const v = parseFloat(String(m.valor).replace(',', '.')) || 0;
        if (m.tipo === 'saida') a.saidas += v; else a.entradas += v;
        return a;
      }, { entradas: 0, saidas: 0 });
      const saldo = totais.entradas - totais.saidas;
      const fmt = (n) => (n || 0).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MZN';

      const meses = (() => {
        const map = {};
        L.forEach((m) => {
          const k = (m.data || '').slice(0, 7);
          if (!/^\d{4}-\d{2}$/.test(k)) return;
          if (!map[k]) map[k] = { ent: 0, sai: 0 };
          const v = parseFloat(String(m.valor).replace(',', '.')) || 0;
          if (m.tipo === 'saida') map[k].sai += v; else map[k].ent += v;
        });
        const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        return Object.keys(map).sort().slice(-8).map((k) => ({
          k, label: nomes[parseInt(k.slice(5, 7), 10) - 1] + '/' + k.slice(2, 4), ent: map[k].ent, sai: map[k].sai,

        rows.push(['', '', '', AT('finBalance'), String(saldo)]);
        const csv = '﻿' + rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = 'financas-cari-tech-' + new Date().toISOString().slice(0, 10) + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
      };

      const del = (id) => setList((x) => x.filter((m) => m.id !== id));
      const save = async () => {
        setBusy(true); setMsg(null);
        const r = await api('financas-save', 'POST', { financas: list || [] });
        setBusy(false);
        if (r.ok) { setList((r.financas || []).map((m, i) => (m.id ? m : { ...m, id: 'f' + i + '-' + Date.now() }))); setMsg({ ok: true, text: AT('finSaved') }); }
        else setMsg({ ok: false, text: r.message || AT('genErr') });

              </div>
            </div>
            {periodo === 'custom' && (

                <div><label style={{display:'block',fontSize:11,color:'var(--ink-muted)',marginBottom:6}}>{AT('finTo')}</label><input type="date" value={ate} onChange={(e) => setAte(e.target.value)} style={fInput} /></div>
              </div>
            )}
            <div>
              <label style={{display:'block',fontSize:11,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--ink-muted)',marginBottom:6}}><FA name="list-ol" s={12} /> {AT('finQty')}</label>

            </div>
            {meses.length === 0 ? (

              <div style={{display:'flex',alignItems:'flex-end',gap:18,height:200,padding:'10px 4px 0',overflowX:'auto'}}>
                {meses.map((m) => (
                  <div key={m.k} style={{flex:'1 0 54px',display:'flex',flexDirection:'column',alignItems:'center',height:'100%'}}>
                    <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:5,width:'100%',justifyContent:'center'}}>
                      <div title={fmt(m.ent)} style={{width:16,borderRadius:'5px 5px 0 0',background:'var(--success)',height:`${Math.max(2,(m.ent/maxV)*100)}%`,transition:'height .3s'}} />

              </div>
            )}
          </div>
          <div className="admin-panel">
            <div className="admin-panel-head">
              <h2>{AT('financeTitle')}</h2>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>

                        <td><button className="ra-btn danger" onClick={() => del(m.id)}><Trash s={12} /></button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            <button type="button" className="btn btn-accent" onClick={save} disabled={busy} style={{marginTop:16}}>{busy ? AT('saving') : AT('btnSaveFin')}</button>
            <Aviso msg={msg} />
          </div>
        </>
      );
