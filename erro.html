<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Cari Tech Graphic</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root{
      --brand-deep:#0B4E50; --brand-mid:#148486; --accent:#F5791C; --accent-2:#DB640C;
      --ink:#0f1720; --muted:#5b6b73; --card:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(20,132,134,.55), transparent 60%),
        radial-gradient(900px 600px at 110% 110%, rgba(245,121,28,.45), transparent 55%),
        linear-gradient(160deg,#0B4E50,#073E40);
      overflow:hidden; position:relative;
    }
    .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
    .b1{width:420px;height:420px;background:var(--accent);top:-140px;right:-120px}
    .b2{width:360px;height:360px;background:var(--brand-mid);bottom:-160px;left:-120px}
    .wrap{position:relative;text-align:center;max-width:560px;width:100%}
    .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff;margin-bottom:34px;letter-spacing:-.02em;opacity:.92}
    .brand img{height:34px;width:auto}
    .code{font-size:clamp(96px,22vw,190px);font-weight:800;line-height:.9;letter-spacing:-.05em;
      background:linear-gradient(135deg,#ffffff 0%,#ffd9b8 60%,var(--accent) 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
    .glitch{position:relative;display:inline-block}
    .icon-orbit{width:78px;height:78px;margin:0 auto 6px;border-radius:22px;display:grid;place-items:center;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);font-size:34px;color:#fff}
    h1{font-size:clamp(24px,4vw,34px);font-weight:800;margin:10px 0 10px;letter-spacing:-.02em}
    p{color:rgba(255,255,255,.78);font-size:16px;line-height:1.65;margin:0 auto 30px;max-width:440px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
    .btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 14px 34px -12px var(--accent)}
    .btn-accent:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff}
    .btn-ghost:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
    .foot{margin-top:34px;font-size:12.5px;color:rgba(255,255,255,.45)}
    .foot a{color:rgba(255,255,255,.75)}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .icon-orbit{animation:float 4s ease-in-out infinite}
  </style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span>
  <div class="wrap">
    <a class="brand" href="index.html" id="brand"><span>Cari Tech Graphic</span></a>
    <div class="icon-orbit"><i class="fa-solid fa-compass"></i></div>
    <div class="glitch"><h2 class="code">404</h2></div>
    <h1>Perdemos esta página.</h1>
    <p>O endereço que procura não existe, mudou de sítio ou nunca cá esteve. Mas não se preocupe — vamos levá-lo de volta ao bom caminho.</p>
    <div class="actions">
      <a class="btn btn-accent" href="index.html"><i class="fa-solid fa-house"></i> Voltar ao início</a>
      <a class="btn btn-ghost" href="index.html#contact"><i class="fa-solid fa-headset"></i> Falar connosco</a>
    </div>
    <div class="foot">Cari Tech Graphic · Nampula, Moçambique · <a href="cliente.html">Área de Cliente</a></div>
  </div>
  <script>
    // Usa o logótipo do site, se existir.
    fetch('conteudo.php').then(function(r){return r.json();}).then(function(d){
      var b=(d&&d.branding)||{}, logo=b.dark||b.light;
      if(logo){ document.getElementById('brand').innerHTML='<img src="'+logo+'" alt="Cari Tech Graphic" style="filter:brightness(0) invert(1)">'; }
    }).catch(function(){});
  </script>
</body>
</html>
