<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem ligação — Cari Tech Graphic</title>
<meta name="theme-color" content="#0B4E50">
<link rel="icon" href="assets/icons/icon-192.png">
<style>
  :root{--brand-deep:#0B4E50;--brand-mid:#148486;--accent:#e8792f;--ink:#0f1720;--muted:#5b6b73}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#12312f 0%,#0b1214 70%);color:#e8eef0;text-align:center}
  .box{max-width:420px}
  .ic{width:88px;height:88px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;font-size:38px;
    background:linear-gradient(135deg,#1a6e70,#0f4b4d);color:#fff;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
  h1{font-size:24px;margin:0 0 10px;font-weight:800}
  p{color:#93a4ab;font-size:15px;line-height:1.6;margin:0 0 22px}
  button{border:none;cursor:pointer;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px;
    background:var(--accent);color:#fff}
  button:hover{filter:brightness(1.05)}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">&#128246;</div>
    <h1>Sem ligação à Internet</h1>
    <p>Parece que está offline. Assim que a ligação voltar, pode continuar a usar a Cari Tech Graphic normalmente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
  <script>
    // Recarrega automaticamente quando a ligação regressar.
    window.addEventListener('online', function(){ location.reload(); });
  </script>
</body>
</html>
